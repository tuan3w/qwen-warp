[project]
name = "qwen-warp"
version = "0.12.0"
description = "Workspace root of qwen-warp; the code is warpc, a compiler from model checkpoints to fused CUDA kernels replayed as CUDA graphs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.12.*"
# Everything warpc's tools and tests import at run time beyond what warpc requires of itself: the `prefill` extra (fla and vLLM;
# the v0.12.0 hand engine that `WARPC_LEGACY_DIR` names imports both). Versions are fixed by uv.lock and by warpc's pins.
# torch / torchvision / torchaudio come from PyTorch's own cu130 index (see [tool.uv.sources]) so the CUDA runtime matches the nvcc 13.0 that warpc's kernels and the hand engine's library are built with.
dependencies = ["warpc[prefill]"]

[tool.uv]
package = false             # not a Python package: the workspace root only
# vLLM declares setuptools<81; the open advisories (sdist MANIFEST.in bypass, Windows path escape while installing a legacy wheel) are fixed in 83.0.0 / 84.1.0.
override-dependencies = ["setuptools>=84.1.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
warpc = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.workspace]
members = ["warpc"]
