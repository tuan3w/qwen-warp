[project]
name = "warpc"
version = "0.1.0"
description = "Compiler for dense decoder-only LLMs: checkpoint (safetensors or GGUF) in, CUDA-graph decode loop out"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Minimums are the versions the tests were run with.
dependencies = ["torch>=2.14", "numpy>=2.3", "safetensors>=0.8", "gguf>=0.19"]

[dependency-groups]
dev = ["ruff==0.17.6", "transformers>=5.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warpc"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
