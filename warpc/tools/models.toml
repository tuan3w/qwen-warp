# The checkpoints fetch.py, check.py, bench.py and matrix.py work on. Revisions pin the measured files.
# hf: a transformers checkpoint (bf16 safetensors). gguf: one repository per model, its file per quantisation.
# Meta's Llama repositories are gated; the unsloth ones are ungated copies of the same Instruct weights.

