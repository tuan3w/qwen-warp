gwrap / ring5, post-K11 foci; baseline dev 164.67 held 140.54 plain 54.34"}, {"hash": "e98cadd", "date": "2026-11-01 13:08", "msg": "swift-mk: record K11/E7/E8-partial/campaign baseline"}, {"hash": "667757c", "date": "2026-11-01 18:27", "msg": "exp: mtp-chain-depth-sweep \u2014 pre-registered prediction (before any deep-chain measurement)"}, {"hash": "6eb7ad1", "date": "2026-11-01 18:38", "msg": "exp: mtp-chain-depth-sweep \u2014 deep-chain library patch, driver, parity test (ALL OK)"}, {"hash": "3951a3a", "date": "2026-11-01 19:52", "msg": "exp: hyperqwen-vs-swift-mk \u2014 pre-registered predictions"}, {"hash": "cd96ef3", "date": "2026-11-01 20:08", "msg": "exp: hyperqwen-vs-swift-mk \u2014 Part 1 study, harness, model-dir builder"}, {"hash": "a849d25", "date": "2026-11-01 22:04", "msg": "exp: hyperqwen-vs-swift-mk \u2014 HQ DFlash2 x1.53/x1.36 on E0 code/math at same step time, MTP ties, swift-mk wins TTFT/exactness; context/concurrency not measured"}, {"hash": "9602811", "date": "2026-11-01 22:08", "msg": "exp: mtp-chain-depth-sweep \u2014 k=4 never loses (+5-20%), k=7 x1.35-1.57 on E6 a-c, prose loses beyond k=4; gate modelled (tail / online gate / sampling not run); results, README, dashboard rows"}, {"hash": "fed67d2", "date": "2026-11-01 22:31", "msg": "swift-mk: dashboard gen.py layout detection by dir names"}, {"hash": "cc66da8", "date": "2026-11-01 23:48", "msg": "swift-mk engine: port campaign lineage m3 (repacked W4 layout, lazy rank-1 DeltaNet replay, lop3 GEMV, DeltaNet prologue, register cap); fix stale lazy-DeltaNet pending count on server snapshot restore; tests/test_w4r.py; server/ab_visit.py"}, {"hash": "9c3de9b", "date": "2026-11-01 23:48", "msg": "swift-mk: K12 m3 port measured \u2014 k=3 x1.09-1.11, plain step -5%, server vs stock vLLM greedy x1.86-1.95 / T=1 x1.94-2.02, TTFT 37 vs 84 ms; BENCH/ENGINE/server README/dashboard, evidence in engine/results/m3-port"}, {"hash": "aef1db8", "date": "2026-11-01 23:50", "msg": "swift-mk: public README reflects the ported m3 engine (K12, server-verified numbers, known issues)"}, {"hash": "b8b8feb", "date": "2026-11-01 23:55", "msg": "swift-mk: infographic updated to server-verified m3 port numbers (K12): x1.9-2.0 vs stock vLLM, port A/B, resume-bug catch"}], "gemv_log": "# K5 W4 GEMV tuning log (2026-10-31)\n\nGoal: raise the average W4 GEMV bandwidth of the real 64-layer step (nsys: 756 GB/s average, 79% of the 20.9 ms step) towards the ~880-900 GB/s a\npure streaming read reaches.  Every attempt below is a measurement, kept or not.\n\n## Method\n* `tests/gemv_lab.cu` (+ `lab_v2.inc`, `lab_variants.inc`): standalone harness, one CUDA graph of `nb` launches over distinct random weight buffers\n  (>= 400 MB, L2-cold), T=1 unless stated.  Kernel variants are compile-time flags (`k_w4x` = the committed `k_w4` with experiment switches).\n  Timing: first runs used 20 ms windows and were dominated by DVFS (boost vs the 350 W cap): **never trust < 0.5 s windows**.  Final numbers: 200 ms warm-up +\n  400 ms measurement window per variant, 3 interleaved rounds, median (clocks settle at ~1600 MHz / 313 W = what the engine sees: lab gate|up 115.7 us vs engine nsys 114.5 us).\n* `ncu --set full` on the engine's own k_w4 instances (locked 1.33 GHz) and on lab kernels; nsys per-kernel table of the real step (`--capture-range=cudaProfilerApi`).\n* Read-only reference in the same harness (`readonly-ref`): every warp streams a contiguous slice, 16 B loads, depth 4: **873 GB/s of weight bytes** (gate|up size), 860 (down).\n\n## Findings (what limits the committed kernel)\n| finding | evidence |\n|---|---|\n| Not DRAM locality / layout: a tile-contiguous weight layout (each warp unit = 1 KB contiguous, a CTA streams a contiguous 8 KB per step) is within +-1% of row-major | gate|up 110.0 -> 111.0 us, down 56.7 -> 56.5, qkv|z 54.7 -> 54.8 |\n| Not footprint / TLB: 200 distinct down buffers (8.9 GB) = 56.98 us, same as 10 buffers (56.73) | lab7 |\n| Not clocks alone: engine k_w4 down is 22% slower than the identical-instruction lab kernel under ncu with locked clocks (73.1 vs 59.9 us, same bytes, same occupancy) | code-generation/schedule dependent; the real `k_w4<8,4,2,2>` down is 67-70 us in lab *and* engine, my restructured copy 56.9 |\n| Instruction count matters only mildly: removing dequant+mma altogether (hack) gains 3.5% (gate|up), 4% (down), 7% (o_proj); the loads-only floor (W+S+X loads, same access pattern) is 106.1 us for gate|up vs 115.7 committed | `AB1` variants |\n| Scale loads cost exactly their bytes (3.1% of traffic); activation loads cost ~2% | noS / noX hacks |\n| The k_w4 main loop is 218-230 SASS instr per 1 KB (ncu: 309 incl. tile epilogue), 64-bit row-pointer arithmetic is recomputed per group | cuobjdump |\n\n## Attempts\n| # | change | shape: before -> after (us, T=1, sustained clocks) | verdict |\n|---|---|---|---|\n| 1 | L2 prefetch (`prefetch.global.L2`) of the next kernel's first-wave weights (2.2 / 1.1 / 0.5 MB) issued when a warp's load stream ends | gate|up 110.98 -> 117.4; down 56.5 -> 57.0..58.3; qkv|z 54.8 -> 58.3; o 22.4 -> 22.7 | **rejected**: always slower (prefetch traffic is not hidden in the tail) |\n| 2 | evict-first L2 policy (`createpolicy` + `L2::cache_hint`) on weight loads, with / without prefetch | +-0.3% without prefetch, worse with | rejected |\n| 3 | tile-contiguous weight layout (repack) | +-1% | rejected as a goal in itself (needed by 7) |\n| 4 | wave-interleaved layout (hack: unit order = time order of the whole grid) | gate|up 118 vs 111 (tile-contiguous) | rejected |\n| 5 | packed u32 scale per (tile, group, row) instead of 2 x u16 | gate|up 111.2 -> 116.9 on the old kernel (slower: loses the L1 hits of the row-major u16 sectors) | rejected on the old kernel, fine inside 7 |\n| 6 | config sweep: w16 (68 CTAs), KS=1/2, U=3/4 on the old kernel | gate|up w8k8u2 110.0, w8k8u4 112.0, w8k8u3 112.6, w16k8u2 114.1, w8k2u2 115.0, w8k1u3 177.8; down: u3 58.3, u4 59.0, w16 57.5, k2 69.5, k1 123 | rejected (register pressure / more tile-end syncs) |\n| 7 | **k_w4 rewritten (kept)**: pointer-increment addressing (no per-group 64-bit row math), activation fragments loaded just in time (no double-buffer registers), unpredicated B loads (lanes g>=T read row T-1: column n of the mma result depends only on B column n, never stored), natural weight layout, same epilogue | lab (sustained clocks, T=1): down real k_w4 67.7 -> 56.8 us (the lab copy of the old kernel: 57.6); gate|up 112.2 (w8k4u2), qkv|z 55.7, q|k|v 49.3 (w8k8u2), o 22.1; outputs rel-L2 0.0 vs old kernel (bit-identical for T=1 and T=4) | **kept** |\n| 8 | default config re-sweep inside the full graph (`SMK_CFG`) with the new kernel: all w8k4u2 except q\\|k\\|v (N=14336) w8k8u2 | step 20.250 (old defaults) / 20.214 / 20.260 / 20.227 / 20.279 ms: all within 0.3% | kept (-0.04 ms) |\n| 9 | nibble order permuted inside each word (natural addressing, no PRMT on the activations) | lab: gate|up 112.2 -> 111.2, down 56.8 -> 56.0, qkv|z 55.7 -> 55.3 (~1%) | not pursued: changes K4/K6/pack consumers for ~0.1 ms |\n| 10 | full repack (tile-contiguous 1 KB warp units, u32 scale per (tile, group, row), nibble pairs): lab T=1 vs #7: gate|up -3.1%, qkv|z -4.2%, q|k|v -3.6%, down -2.3%, o 0 | timing-only build (kernel reads the natural buffers through the repacked addressing, outputs garbage): whole step T=1 20.192 -> 19.983 ms (-0.21), T=4 21.56 -> 21.11 (-0.45) | **deferred**: below the 0.4 ms/step bar at T=1; would change the weight layout for K4 (MTP packer), K6 (prefill dequant), pack.py and test_ops |\n\n## Result (engine, `tests/bench_e2e.py`, ctx 64, bf16 KV, 5 interleaved A/B repeats, lease held; baseline = committed HEAD built into build_base)\n| step | before (ms) | after (ms) |\n|---|---|---|\n| T=1 plain decode | 20.981 (20.937-20.988) = 47.7 tok/s | **20.195** (20.186-20.223) = 49.5 tok/s |\n| T=2 | 21.566 | 20.721 |\n| T=3 | 22.053 | 21.077 |\n| T=4 verify | 22.582 (22.564-22.675) | **21.545** (21.536-21.624) |\n\nnsys of the real step (20 steps, `--cuda-graph-trace=node`), W4 GEMV kernels (avg us per call, GB/s over weight+scale bytes):\n| GEMV | calls/step | before | after |\n|---|---|---|---|\n| gate\\|up (91.9 MB) | 64 | 114.66 us, 801 GB/s | 115.35 us, 797 GB/s |\n| down (46.0 MB) | 64 | 69.82 us, 659 GB/s | **56.65 us, 812 GB/s** |\n| qkv\\|z (43.3 MB) and q\\|k\\|v (37.8 MB), mixed | 64 | 52.01 us | 52.89 us |\n| o_proj (16.3 MB) | 64 | 23.54 us, 691 GB/s | 23.40 us, 695 GB/s |\n| all W4 GEMVs | 256 | 16.64 ms, 757 GB/s average | **15.89 ms, 793 GB/s average** |\nThe whole gain is `down` (-0.85 ms) plus the K-order-independent bookkeeping; in the graph gate|up / qkv|z / o_proj are unchanged (the lab's \"old kernel\" copy for those shapes was slower than the real k_w4, so lab gains there did not transfer).\n\n## What is left\n* Loads-only floor (same access pattern, no dequant/mma) is ~4% under the current kernel for gate|up, 7% for o_proj; a pure streaming read is another ~8% below that (873 vs ~800 GB/s of weight bytes).\n* Remaining structural costs per kernel: ~1 us launch gap + first-DRAM-latency ramp + tail (o_proj, 16 MB, is at 695 GB/s: ~2.5 us fixed cost); L2 prefetch of the next layer does not hide it (#1).\n* Repack (#10) is the only measured remaining lever (0.2-0.45 ms).\n\n## Round 2 (gemv2 lineage, on the repacked layout)\n| # | change | result | verdict |\n|---|---|---|---|\n| 11 | dq_word as one lop3 per nibble pair (constants in registers) + branch-free (step / wrap) 32-bit stream offsets in k_w4 + activation pointer base + ct*KS*16 (SASS ~234 -> ~160 lines per group, bit-identical outputs) | full `try`: 173.15 -> 176.71 / 177.24 tok/s (+2.1% / +2.4%), check PASS | **kept** |\n| 12 | on top of 11: U+1 rotating weight register sets (no copies), 32-bit running activation offset | 173.69 (-2% vs 11, regs 96 -> 77) | rejected |\n| 13 | config re-sweep on the repacked layout inside the real graph (nsys, per shape): w8k4u2 vs w8k2u3 vs w8k1u3 | w8k4u2 best for gate\\|up 110.7 / 112.1 / 115.5 us, down 55.9 / 56.9 / 84.2, o 22.4 / 23.7 / 31.8, qkv\\|z 54.2 / 55.9 / 59.1 | table unchanged |\n| 14 | programmatic dependent launch (griddepcontrol) to overlap GEMV ramp/tail | ptxas: requires sm_90 | impossible on sm_86 |", "log": ["- 2026-10-30 22:22 [omp] megakernel: E1 (synthetic W4 stream, 3090): persistent+prefetch only +2.5% over per-op CUDA graph (795 vs 809 GB/s of 891 peak); PDL impossible on sm_86; program reframed to fused kernel set + MTP verify; 8 megakernel repos studied", "- 2026-10-31 07:18 [omp] megakernel: E0 stock vLLM on Swift INT4 3090: k0 46.8 tok/s (76% roofline), MTP k3 96 (code) / 63 (prose); draft heads ~12 of 37 ms per k3 step is the recoverable cost; E2/E3 cancelled by human", "- 2026-10-31 23:44 [omp] swift-mk K8: OpenAI server on vLLM's frontend + swift-mk EngineCoreClient (server): HTTP decode 152/96/149/122 tok/s vs stock vllm serve 96.6/64.4/94.8/74.1, multi-turn resume 0.24 s vs 0.91 s TTFT", "- 2026-10-31 23:45 [omp] megakernel: engine+server done: same-client HTTP k=3 1.49-1.65x stock vllm serve (152/96/149/122 vs 96.6/64.4/94.8/74.1), prefill 2100 tok/s@8K, exact spec sampling, multi-turn resume; dashboard dashboard", "- 2026-11-01 02:19 [omp] K10 short-prompt prefill: W4 mma GEMM for <=240-token prompts + last row folded into the batch: server TTFT 20/40 tokens 130/235 -> 38/47 ms (stock vLLM ~96); see engine/BENCH.md K10", "- 2026-11-01 05:10 [omp] swift-mk K9 lm-head-quant-engine done: int4 g128 (default) / int8 per-row head + exact bf16 rescoring of top-16 (64 sampling) in the engine graphs: plain step 20.15 -> 18.105 ms, k=3 greedy +10% (167.8/107.4/165.5/151.9), BF16-head argmax on 19,976 positions, K7 chi-square unchanged, +0.59 GiB (max-model-len 40960 -> 36864)", "- 2026-11-01 08:22 [omp] swift-mk K11 pld-tail-engine done: MTP chain + prompt-lookup tail verify T<=8 in the engine: V(8)=21.6 ms, host round trip <10 us, E6 classes a/b/c/d/e greedy x1.389/1.329/1.461/1.014/1.072 (a-c x1.38, 240 vs 175 tok/s; sampling x1.36/1.32/1.43/1.00/1.07), exact greedy + K7 sampling, +0.62 GiB (max-model-len 36864->28672), server --prompt-lookup auto", "- 2026-11-01 13:07 [omp] swift-mk campaign harness re-synced to K11 (engine a2f79e4, HEAD 5f82489): shipped tmax=8 + PLD workload, T=8 / tmax4 / PLD-trials / forced 8-row checks, 6 dev prompts, 13 held cells; baseline dev 164.67 held 140.54 plain 54.34; gate 12.6 GPU-min; mechanics pldtail/ringwrap/ring5 caught", "- 2026-11-01 22:03 [agent] hyperqwen-vs-swift-mk done: HyperQwen on our Swift-1.5 weights (same client, 350 W): MTP ties swift-mk (174/104/177/139 vs 166/107/166/131 E0), DFlash2 x1.53/x1.36 on E0 code/math (254/225), x1.14 E6 a-c, x1.24 E8 at same ~22 ms step (5.2-5.8 vs 3.5 tok/step); swift-mk wins TTFT (39 vs 53-56 ms) and exactness (parity 7/30); context/concurrency/dflash15 not measured"]};
const $=(s,e=document)=>e.querySelector(s);const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('#gen').textContent='generated '+D.generated+' from git + experiment READMEs';
const tabs=['Overview','Trace','Experiments','Predictions vs reality','Failures & dead ends','Ideas','Work packages','GEMV log'];
const nav=$('#nav'),main=$('#main');
function bars(title,labels,series,unit){ // grouped horizontal bars (inline SVG-free, CSS)
  const max=Math.max(...series.flatMap(s=>s[1]));const cols=['#6ea8fe','#3ecf8e','#f5c04a','#b39ddb','#ff9f6b'];
  let h=`<div class="card"><h3>${title}</h3>`;
  labels.forEach((l,i)=>{h+=`<div style="margin:8px 0 2px" class="mut">${l}</div>`;series.forEach((s,j)=>{const v=s[1][i];h+=`<div style="display:flex;align-items:center;gap:8px"><div style="width:170px;font-size:12px" class="mut">${esc(s[0])}</div><div class="bar" style="width:${v/max*55}%;background:${cols[j%5]}"></div><div>${v}</div></div>`})});
  return h+`<div class="mut" style="margin-top:6px">${unit}</div></div>`}
function steps(){const mx=Math.max(...D.step_ms.map(r=>r[1])),mn=Math.min(...D.step_ms.map(r=>r[1]))-1;
  let h='<div class="card"><h3>Plain decode step time (ms, lower is better; roofline floor ~16.2 ms at 936 GB/s)</h3><table><tr><th>stage</th><th>ms</th><th>tok/s</th><th></th><th>pointer</th></tr>';
  D.step_ms.forEach(r=>{h+=`<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td>${(1000/r[1]).toFixed(1)}</td><td style="width:35%"><div class="bar" style="width:${(r[1]-mn)/(mx-mn+0.5)*100}%;background:var(--acc)"></div></td><td class="mut">${esc(r[2])}</td></tr>`});return h+'</table></div>'}
const V={
Overview(){let h='<div class="grid">'+bars('MTP k=3 decode tok/s (384 tokens, prefill excluded)',D.spec.labels,D.spec.series.map(s=>[s[0],s[1]]),'greedy unless noted; engine uses bf16 KV, vLLM fp8 KV (auto); different measurement sessions &mdash; see caveats in the README')+steps()+'</div>';
  h+='<div class="card"><h3>Where the program stands</h3><ul><li>Engine = fused kernels in a CUDA graph (not a persistent megakernel: E1 showed persistence +2.5% only).</li><li>Plain decode 20.2 ms/step (49.5 tok/s) vs vLLM 21.4 ms; speculative k=3 &asymp;1.5-1.7x vLLM.</li><li>Prefill ~2100 tok/s at 8K (vLLM ~1900); exact speculative sampling; OpenAI-compatible server done (HTTP overhead ~0%).</li></ul><p class="mut">Every number links to a file in the Experiments / Work packages tabs.</p></div>';return h},
Trace(){let h='<div class="card"><h3>Commit trace (swift-mk / experiments / ideas)</h3><div class="tl">';
  D.commits.forEach(c=>{const x=/dead|abandon|cancel|fail|negative|miss/i.test(c.msg);h+=`<div class="it ${x?'x':''}"><span class="mut">${c.date} &middot; ${c.hash}</span><br>${esc(c.msg)}</div>`});
  h+='</div></div><div class="card"><h3>log.md (this program)</h3><pre>'+esc(D.log.join('\n'))+'</pre></div>';return h},
Experiments(){let h='<input type=search id=q placeholder="filter experiments...">';D.experiments.forEach(e=>{
  const c=e.status==='done'?'ok':(e.status==='abandoned'?'bad':'warn');
  h+=`<div class="card exp"><h3>${esc(e.dir)} <span class="tag ${c}">${esc(e.status)}</span> <span class="tag">${esc(e.confidence||'-')}</span></h3>
  <div><b>Q:</b> ${esc(e.question)}</div><details><summary>pre-registered prediction</summary><pre>${esc(e.prediction)}</pre></details>
  <div style="margin-top:6px"><b>A:</b> ${esc(e.answer)||'<span class=mut>no answer recorded</span>'}</div>
  <details><summary>conclusion</summary><pre>${esc(e.conclusion)}</pre></details></div>`});return h},
'Predictions vs reality'(){let h='<div class="card"><h3>Pre-registered predictions vs measurement</h3><table><tr><th>quantity</th><th>predicted</th><th>measured</th><th>verdict</th><th>experiment</th></tr>';
  D.predictions.forEach(p=>{const c=p[3].startsWith('HIT')?'ok':(p[3].includes('better')?'warn':'bad');h+=`<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td><td>${esc(p[2])}</td><td><span class="tag ${c}">${esc(p[3])}</span></td><td class="mut">${esc(p[4])}</td></tr>`});
  const miss=D.predictions.filter(p=>p[3].startsWith('MISS')).length;return h+`</table><p class="mut">${miss} of ${D.predictions.length} listed listed predictions missed (curated list, biased toward the ones with a clear number; the full set is in each README): wrong guesses were mostly about the baseline (vLLM is faster than expected) and about what is free in the draft path.</p></div>`},
'Failures & dead ends'(){let h='';D.experiments.forEach(e=>{if(!e.dead.trim())return;h+=`<div class="card"><h3>${esc(e.dir)}</h3><pre>${esc(e.dead)}</pre></div>`});
  h+='<div class="card"><h3>Program-level failures</h3><ul><li><b>Persistent megakernel premise</b>: only +2.5% over per-op CUDA graph (E1); PDL impossible on sm_86; E2 (dataflow/fusion) cancelled, still open.</li><li><b>Fused RMSNorm in GEMV prologue</b>: +5 us/GEMV, worse (21.47 vs 20.93 ms) &mdash; removed.</li><li><b>K5 "bit-identical" claim</b>: false; rounding-level differences found by K7 follow-up (be8661e).</li><li><b>Restricted 32k draft vocab</b>: not free (-6% accepted length).</li><li><b>lm_head int8/int4</b>: none passed the pre-registered rule; rescoring hybrid needed (E5).</li><li><b>Process</b>: parallel agents contending for one GPU/lease corrupted timing and blocked work; one stale lease released by another agent.</li></ul></div>';return h},
Ideas(){let h='';D.ideas.forEach(i=>{h+=`<div class="card"><h3>${esc(i.title)} <span class="tag">${esc(i.status)}</span></h3><div class="mut">${esc(i.file)}</div><details open><summary>attempts</summary><pre>${esc(i.attempts)}</pre></details></div>`});return h},
'Work packages'(){let h='<div class="card"><h3>Agent work packages</h3><table><tr><th>agent</th><th>task</th><th>outcome / pointer</th></tr>';D.agents.forEach(a=>{h+=`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td class="mut">${esc(a[2])}</td></tr>`});return h+'</table></div>'},
'GEMV log'(){return '<div class="card"><h3>engine/GEMV_LOG.md (every attempt, kept and failed)</h3><pre style="max-height:none">'+esc(D.gemv_log)+'</pre></div>'}
};
function show(t){[...nav.children].forEach(b=>b.classList.toggle('on',b.textContent===t));main.innerHTML='<section class="on">'+V[t]()+'</section>';location.hash=t;
  const q=$('#q');if(q)q.oninput=()=>document.querySelectorAll('.exp').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(q.value.toLowerCase())?'':'none')}
tabs.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>show(t);nav.appendChild(b)});
show(decodeURIComponent(location.hash.slice(1))||'Overview');
</script></body></html>
