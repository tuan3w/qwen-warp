nfidence": "medium", "dead": "- First `lab run` refused: only 3.6 GB free (guard needs 8). Ran with LAB_MIN_FREE_GB=2; disk is the practical limit on this box (99% full).\n- Prediction used a guessed Marlin efficiency (75%) and launch-gap cost; the measured 706 GB/s effective suggests vLLM's graph path is already close to what E1 measures for a graph of plain GEMVs.", "conclusion": "Prediction was wrong in the direction that matters: stock vLLM plain decode is 46.8 tok/s, not 34 (predicted range 28-42), and the \"k=0 > 45\" escape clause fired. Against the E1 synthetic bound (GEMV-only graph 18.96 ms = 52.7 tok/s) plain decode has at most ~12% headroom; against the copy-peak 16.9 ms (59 tok/s) at most ~26%. MTP predictions also missed (k=1 predicted 52, got 63-71; k=3 predicted 58, got 57-96): Swift's MTP head is far better aligned than the 2B model's 0.70-0.73 (mtp-rollout-speed), on code/math. Acceptance is strongly text-dependent: prose gets almost nothing from k=2,3 (62.6 -> 63.0), so a fixed k is wrong; k=3 at T=1 on code (86) is ~10% below greedy (96).\nThe remaining prize is in the speculative path, not plain decode: ~12 of the 37 ms per k=3 step is drafting through full-vocab BF16 heads, and verification of 4 rows costs 1.74x - draft included - over a plain step. A fused engine with a restricted-vocab/quantised draft and near-free multi-row verify could plausibly reach ~23 ms/step [INFERENCE] = ~155 tok/s on code, ~1.6x stock; plain decode gain is capped near +10-15%.\nCaveats: 3 repeats, 4 prompts, one seed, FP8 KV chosen automatically (which attention backend vLLM picked was not recorded), output of this lab run not checked for text equality across k."}, {"dir": "2026-10-30-w4-multirow-verify-and-power", "status": "done", "question": "On one RTX 3090, with clean-room tensor-core (mma.sync m16n8k16 bf16) W4A16 g128 kernels that dequantise int4->bf16 once in registers and reuse it across T activation rows, how does the time of the real big matvec shapes (gat per-warp K slices and `__ldcs` weight loads (`E3_LDW_CS` still in `kernels.cuh`; directory name + header comment, v1 source not retained [INFERENCE on the exact differences]). mma/sub at T=1: down 0.0744 ms (759 GB/s, 23% *slower* than cc/e1 0.0605), gate|up 0.1133, qkv|z 0.0547; lm_head mma/bf16 5.36 ms (474 GB/s) in Q2; T=8 gate|up 1.155x, T=16 1.51x. The current kernels (K-split warps read adjacent 64 B pieces of a row, `ld.global.nc.L1::no_allocate`) fixed T=1 (down 0.0566, lm_head 3.03 ms) and slightly improved growth (T=8 1.12x, T=16 1.45x), but did not reach the predicted flatness.\n- **Tensor-pipe-bound hypothesis (pre-registered cause) is dead**: ncu HMMA pipe 16-19% (T<=8), 31% (T=16); the real cause is B-operand L1 traffic (see Q1).\n- **First ncu.json was garbage**: the CSV uses the `en_US` locale (decimal comma, `.` thousands: `86,20`, `92.037.248`), and `run.py` stripped commas, turning 89.61 % into 8961. Fixed by running ncu with `LC_ALL=C`; the table above is from the second run.\n- **`ones` dequant is not a free win**: 0.4-1.2% at T=1, but at T=5..8 it is 2-4% slower than `sub` (per-token group-sum table loads add LSU traffic exactly where B delivery already limits).\n- **NT=2 (T 9..16) kernels spill registers** (loading the next group's B early needs a second 32-register copy; disabled for NT=2). T=12/16 are therefore upper bounds on cost for this kernel family, not hardware limits.\n- Q1 per-window nvidia-smi clocks (6-12 samples) are not usable; Q2 3 s windows carry the power evidence. Clock locking (`-lgc`) was not attempted (root), so power-vs-issue is not separated.\n- Not done: Marlin comparison, real DeltaNet / attention kernels (their cost is modelled), end-to-end run with real weights, acceptance with restricted head / int4 MTP layer.", "conclusion": "**Q1 (growth with T).** The pre-registered \"flat to T=8\" is falsified on the W4 shapes: measured x vs T=1 at T=8 is 1.12 (gate|up), 1.12 (down), 1.15 (qkv|z), 1.05 (o_proj) against a bet of th grid barriers, persistent kernel with cross-barrier weight prefetch? What does one grid barrier cost?", "prediction": "Copy peak ~880 GB/s (94% of 936). Graph per-op kernels ~72% of peak (~610 GB/s, ~25 ms/step); graph+PDL ~79%; persistent no-prefetch ~76% (barrier ~3 us x 257-338 phases ~ 1 ms); persistent with cross-barrier prefetch ~88% of peak. Persistent-with-prefetch / graph+PDL = 1.07 (range 1.00-1.15). Kill criterion: ratio < 1.05 means persistence per se is not worth its complexity; the program becomes a fused kernel set in a CUDA graph.", "answer": "Persistence is worth 1.5-4%, not 7%: V4 (persistent + cross-barrier prefetch) 18.64 ms/step = 809 GB/s = 90.8% of the 891 GB/s read-only peak vs best per-op CUDA graph (V1b) 19.12 ms = 789 GB/s (88.6%): V4/V1b = 1.025 (1.039 same config) < 1.05, kill criterion triggered; PDL impossible on sm_86; bare grid barrier 0.70-0.74 us, but each phase pays ~5-6.5 us (act gather ~2, tail 2-4, in-situ barrier ~1).", "confidence": "medium", "dead": "- **V2 (graph + PDL) is impossible on sm_86.** `griddepcontrol.wait` / `.launch_dependents` fail in ptxas with `Modifier '.wait' requires .target sm_90 or higher` / `Instruction 'griddepcontrol' requires .target sm_90 or higher` under `nvcc -arch=sm_86` (CUDA 13.0.88); the same probe compiles for sm_90 (`results/pdl_attempt.json`). Replaced by V1b (weights prefetched before the dependent activation read; kernel boundary still drains).\n- **V1b did not beat V1a.** Issuing the first weight tiles before the activation prologue made the graph kernels 0.8 % *slower* in the main run (19.116 vs 18.958 ms) and was faster in only 19 of 34 sweep configs (e.g. w16r4d1 19.55 vs 19.64, but w8r4d1 19.18 vs 19.02). [INFERENCE, from the V3 timeline where the prologue is 2.81 us vs 1.95 us in V4: the early cp.async traffic queues in front of the prologue's x/h loads.]\n- **V1c (classic launch, hardware load balancing, dynamic smem so 2-3 CTAs/SM) is the slowest style**: best 20.0 ms (w16r4d1: sweep 20.049, main 20.016); sweep w12r4d1 21.90, w8r4d2 22.83, w8r4d1 23.00, w4r4d1 24.55, w8r2d1 24.68 ms [INFERENCE: every CTA repeats the activation prologue and a warp executes a single task, so no warp tail overlaps the next task; not separately measured].\n- **Bigger rings are not monotonically better and warp counts that are not a multiple of 4 are bad.** In the sweep, 5/6/10/15-warp CTAs are 6-28 % slower than 4/8/12/16 for V1b (best V1b per warp count: w4 19.23, w8 19.15, w16 19.21, w12 19.29, w10 20.33, w6 20.49, w15 22.26, w5 24.52 ms) [INFERENCE: uneven warps per scheduler; not checked with ncu]; w24/w32 configs spill registers (`runs/build.log`: 12-88 B spill stores in the persistent kernels) and are slow; V1b/V3 get worse with ring depth at w8r2 while V4 improves up to d5 and is flat after (w8r2: V4 d2 18.814, d5 18.643, d6 18.724, d7 18.720; V1b d2 19.116, d5 19.365, d6 19.581, d7 19.605 ms; sweep and main runs).\n- **Uniform random nibbles made the residual stream explode** (mean of (n-8) is -0.5, a common-mode term that feeds back through 64 layers: x rms 6850 at the end, a first check showed a deceptively small 1e-4 error vs the reference [INFERENCE: one late layer dominated x]). Fixed by remapping nibble 0 to 8 (zero-mean values -7..7, `k_fill_w4`); x rms is now 1.8.\n- **Static imbalance is a real but partial explanation of the tail.** Shrinking the grid to 64 CTAs so that tasks divide evenly raised qkv|z with w8r4d1 from 785 to 820 GB/s and gate|up 825 -> 847, but o_pr", "conclusion": "**On the 3090, persistence with cross-barrier prefetch buys 1.5-4 % over the best per-op graph, not the predicted 7 %: V4 18.64 ms (809 GB/s, 90.8 % of the 891 GB/s read-only peak) vs V1b 19.12 ms (789 GB/s, 88.6 %) -> V4/V1b = 1.025 (1.039 at an identical ring config); the kill criterion (< 1.05) triggers, so the program should be a fused kernel set in a CUDA graph, with persistence an optional later 2-3 % at best.** Reasons, all measured: (1) PDL does not exist s the BF16 head's on all 19,976 positions (the BF16 top-1 was always among the 16 candidates; the one differing argmax, position 12527 at T=4, is an exact fp32 tie between tokens 279 and 264 (margin 0.0) resolved the other way by the accumulation order of the rescoring dot vs the mma kernel), so spec == plain greedy parity and the committed test suites hold, and the sampling distribution is unchanged within 1e-5 at top_k <= 20.\n**Default = int4** (rule: int4 only if sampling TV and log-loss pass: they do; it is +3.7 points faster than int8 and needs 0.59 instead of 1.18 GiB, which matters because the BF16 head must stay resident: int8 does not fit the server's default 32768 bf16 context).  Caveat: with int4 and top_k > 20 the rescoring set (64) misses part of the true top-64 on flat positions (mean TV 0.0015, p99 0.018 at top_k 64, which is what the server uses when the request has no top_k <= 64); `SMK_HEAD=int8` (TV 0.00013) or `SMK_HEAD=bf16` restore exactness at a cost of ~4 / ~10 points of tok/s.\n**Against the prediction (frozen in the frontmatter)**: right: int8 18.85 -> 18.80 ms, int4 18.25 -> 18.105 ms (slightly better), T=4 verify 20.15 / 19.5 -> 20.146 / 19.366, int8 +5.5-6.5% (+6.0-6.5%), parity, TV (int8 < 0.001, int4 < 0.003 at 5 positions: <= 1e-5), chi-square p > 0.01, default int4, tail 25-60 us, VRAM cost +0.59 / +1.27 GB (int4 measured +0.61 GiB at max-model-len 32768; int8 +1.18 GiB from the tensor sizes, it OOMs at 32768), max context drop (bf16 40960 -> 36864 on a 4096 grid; fp"}, {"dir": "2026-10-31-lm-head-quantisation-quality", "status": "done", "question": "Can Swift-1.5-Qwen3.8-27b's main-model BF16 lm_head (checkpoint lm_head.weight bf16 [248320,5120], 2.54 GB = 2.87 ms of the 20.9 ms engine step) be stored as int8 per-row (RTN or clip-searched), int6 per-row, or int4 g128 (RTN, clip-searched, activation-weighted clip-searched) without hurting output quality (>= 99.5% top-1 agreement vs the fp32-accumulate BF16 reference logits, teacher-forced log-loss delta CI includes 0 or < 0.002 nats, top-k20/top-p0.95 filtered-distribution TV < 0.005), measured on >= 4000 final-norm hidden states from the real engine over text that is not the vocab corpus, relative to a noise floor (engine bf16 kernel vs fp32 reference; T=1 vs T=4 hidden rows; bf16-rounded logits); and what would the CUDA-core int8 / smk_w4_gemv int4 head gain on the 3090 for the T=1 plain step and the T=4 verify step?", "prediction": "Frozen before any run. Decision rule (task): ADOPT iff top-1 agreement >= 99.5% AND log-loss-delta 95% CI includes 0 or point delta < 0.002 nats AND sampling TV < 0.005. Bets (pooled over all eval positions): (1) int8 per-row RTN: top-1 agreement 99.9% (>= 99.8%), full-vocab KL(ref||q) ~2e-5 nats, log-loss delta +0.0001 (|delta| < 0.0005, CI includes 0), sampling TV (top_k20+top_p0.95, T=1) 0.001 (<0.003), argmax changes on the 4 verify rows in < 0.5% of 4-row blocks: ADOPT. int8 clip-search is within 10% of RTN on every metric (no meaningful gain; int8 absmax rows have no outliers worth clipping). (2) int6 per-row: top-1 99.7%, ADOPT. (3) int4 g128 RTN (scale amax/7, q in [-8,7], bf16 scale): top-1 agreement 97.5% (range 96.0-98.8), KL ~0.012, log-loss delta +0.010 nats (CI excludes 0), TV 0.02 (range 0.01-0.04): FAIL on all three criteria. int4 g128 per-group clip search: KL 25% lower than RTN, top-1 98.2% (range 97-99.2), still FAIL (P(passes top-1 >= 99.5) = 10%, P(passes TV < 0.005) = 5%). Activation-weighted clip search (calibrated on disjoint docs) is within +-0.3 pt top-1 of plain clip search (bet 98.4%), still FAIL. Closest int4 arm to the rule = activation-weighted clip search on every metric. (4) Noise floor: engine's own bf16 head kernel vs my fp32-accumulate reference on the same hidden: top-1 agreement >= 99.97%, log-loss delta |.| < 1e-4; hidden-state T=1 vs T=4 rows through the whole engine: top-1 agreement 99.6% (range 99.0-99.9), log-loss delta CI includes 0; bf16-rounded reference logits: top-1 agreement 99.7%. The pass threshold 99.5% is therefore close to the T=1-vs-T=4 floor and int8 is indistinguishable from the floor. (5) Speed (3090, L2-cold, 886 GB/s class): int8 per-row CUDA-core GEMV (my kernel, fp32 logits out) T=1: 1.50 ms (range 1.45-1.65), T=4 (4 accumulators per thread, same read): 1.70 ms (1.5-2.0); smk_w4_gemv EPI_F32 N=248320 K=5120 (0.656 GB incl. scales) T=1: 0.88 ms (0.78-1.0), T=4: 0.95 ms (0.85-1.1). Modelled step gain vs the shipped 2.87 ms (T=1) / ~3.0 ms (T=4 mma): int8 T=1 -1.37 ms = 6.5% of the 20.9 ms step (+7.0% tok/s), T=4 verify -1.3 ms = 5.8% of 22.5 ms; int4 T=1 -2.0 ms = 9.6%, T=4 -2.05 ms = 9.1%. Net recommendation bet: adopt int8 per-row for the verify head (about +6% end-to-end); int4 g128 lm_head does not pass the rule.", "answer": "No pre-registered head passes the rule (15,280 teacher-forced positions / 43 docs, engine final-norm hidden states): int8 per-row is closest (top-1 99.19% [98.90, 99.43] vs 99.5 needed, dNLL +0.00012 [-0.00009, +0.00033], TV 0.0038) and its flips are all near-ties (median margin 0.013 logits); int6 97.3%, int4 g128 RTN/clip/act-weighted 93.8/93.2/94.7% (TV 0.035-0.048): int4 alone is not usable. Post-hoc: int8 with a bf16 scale per 128 cols passes (99.503%, 1231 MB), and int8 or int4 + exact bf16 rescoring of the top-16 candidates gives 0 argmax flips in 15,280 positions (TV 0.0003 / 0.0032; int4 dNLL +0.0018). Head GEMV 2.875 ms bf16 -> int8 1.445 ms (881 GB/s, T=1; 1.546 at T=4) -> int4 0.775 ms: modelled step -6.8% (int8) / -10.0% (int4) at T=1, verify -6.4% / -9.8%; with 65 us rescoring MTP k=3 cycle x1.060 (int8) / x1.097 (int4), code 145 -> ~154 / ~159 tok/s.", "confidence": "medium", "dead": "- First `collect` run crashed after saving the hidden states (NameError in the engine-logits save, 4.5 min of GPU lease lost); fixed and rerun in full, only the second run's outputs were analysed.\n- Weight-MSE clip search is the wrong objective for the head: it lowers weight error (int4 rel-L2 0.125 -> 0.107) but raises logit KL by 40%; only activation-weighted search helps (0.111 rel-L2, KL 0.0069, the best int4 arm). Why is not isolated [INFERENCE: clipped outlier weights/columns carry large logit contributions]. A full GPTQ/Hessian arm was not tried (int4 + rescore already meets the criteria, so not needed for the decision).\n- Top-1 agreement >= 99.5% is a poor criterion for this head: 0.65% of positions are essentially ties (margin < 0.01), so even bf16 output rounding fails it (98.28%) and the engine's own T=1/T=4 pair is at 99.52%; dNLL and TV are the informative metrics, top-1 only matters for greedy exactness, which rescoring restores.\n- Int8 kernel design notes (no failures, first version already at 881 GB/s; the shipped design was chosen up front, the alternatives below were reasoned, not benchmarked): one warp per row with 16 B per lane and x in smem in natural layout would have 32-way LDS bank conflicts and 16 B of smem traffic per weight byte at T=4; used a lane-permuted smem layout and 2 rows per warp (x fragments reused); int8->fp32 by xor 0x80 + PRMT into the mantissa of 2^23 + FADD instead of I2F.", "conclusion": "**Answer.** Under the pre-registered rule no head is adoptable on its own. The closest is int8 per-row (RTN 99.19%, clip-search 99.26%): it passes the log-loss criterion (+0.00012 nats, CI contains 0) and the sampling criterion (TV 0.0038) and misses only the top-1 criterion by 0.3 points, because the 124 flips are all near-ties (median logit margin 0.013, none above 0.1) that cost nothing in likelihood. The criterion itself is near the noise floor: the engine's plain-vs-verify (T=1 vs T=4) discrepancy already gives 99.52%, and bf16-rounded logits 98.28%. int6 (97.3%) and every int4 g128 variant (93.2-94.7%, TV 0.035-0.048, dNLL +0.007..+0.0125, 18-22% of 4-row verify blocks change an argmax) clearly fail; plain int4 would also cancel its speed gain (Table 6 last row: code 146 vs 145 tok/s). Passing configurations found post-hoc: **int8 with a bf16 scale per 128 columns** (99.503% [99.34, 99.65], all three criteria; the point estimate is 0.003 pt above the threshold), and **any of int8 / int4 + exact bf16 rescoring of the top-16 candidates** (0 argmax flips in 15,280 positions and in 3788 verify blocks, TV 0.0003 / 0.0032; int4 dNLL +0.0018 passes the < 0.002 clause, awclip's +0.0026 does not).\n\n**Speed.** The head is purely bandwidth-bound: int8 per-row CUDA-core reaches 881 GB/s (1.445 ms, T=1) and 823 GB/s at T=4 (1.546 ms); `smk_w4_gemv` int4 reaches 846 GB/s (0.775 ms with cfg 1, the default config is 0.778 / 0.824 at T=1 / 4). Against the shipped bf16 head (2.875 / 2.985 ms): plain step -1.43 ms (6.8%) int8, -2.10 ms (10.0%) int4; T=4 verify -1.44 ms (6.4%) / -2.20 ms (9.8%); k=3 MTP cycle x1.063 / x1.100 (code 145 -> ~154 / ~159 tok/s) before any acceptance loss.\n\n**Recommendation.** (1) Do not ship plain int4 or int6 heads. (2) Implement **int8 per-row head + to"}, {"dir": "2026-10-31-mtp-draft-head-ablation", "status": "done", "question": "Does the cheap draft path assumed by the E3 model (int4-quantised MTP layer + draft argmax restricted to a 32k-token vocabulary, optionally plus all prompt tokens, and a fake-quantised int8/int4 draft lm_head) keep Swift-1.5's MTP draft acceptance (mean accepted length and per-position acceptance at k=3, greedy and T=1 top_p0.95/top_k20, 384 new tokens, >=24 held-out prompts: code/math/prose/agent/long-context) within 3% of the unmodified BF16-MTP + full-248k-head arm, with the verification path (full-vocab BF16 target) unchanged?", "prediction": "Arms are relative to arm 0 (unmodified; two runs give the noise floor), mean accepted length per step at k=3, verification untouched. (1) Restricted draft vocab, frequency-chosen from vendor/+topics/ text: V=64k loses <=1%, V=32k loses 1-4%, V=16k 3-8%, V=8k loses >15% on code (bet 25%) because code identifiers and non-Latin tokens fall out. (2) V=32k + all prompt-context tokens: loses <=3% on code and math, <=6% on prose (bet: code 1.5%, math 2%, prose 4%, agent 2%, long 2%). (3) MTP layer weights fake-quantised: int8 per-channel loses <=2%; int4 g128 RTN loses 3-8% (bet 5%, larger on code/math where acceptance is high because later positions compound: pos-3 acceptance falls most). (4) Draft lm_head fake-quantised: int8 loses <=1%, int4 g128 loses <=3% (bet 1.5%). (5) Combined V=32k+ctx, MTP int4, head int8: loses <=10% (bet 7%); with head int4 bet 8%. Verdict rule: an arm is 'free' if mean accepted length is within 3% of arm 0 and within the arm-0 run-to-run noise; I expect free = {V=64k, head int8, head int4, MTP int8, probably V=32k+ctx on code/math}, not free = {V=8k, V=16k on code, MTP int4, combined}. Consequence if the combined arm loses ~7%: the E3-modelled 1.56x k=3 ratio over stock vLLM falls to ~1.45x.", "answer": "On a broader held-out set (25 prompts: 6 code/6 math/6 prose/4 agent/3 long, greedy + 2x T=1, 384 tokens, k=3, vLLM 0.30 in-process, verification untouched), the cheap draft path is mostly free but the 32k restricted vocabulary is not: int4-g128 RTN MTP layer 0.990/0.998 (greedy/T=1) of baseline mean accepted length, int8 MTP 1.001/1.006, draft lm_head int8 1.002/1.002 and int4 1.000/0.997 are all FREE (>=0.97); restricted vocab V=64k 0.994/0.990 FREE, V=48k+prompt+generated tokens 0.986/0.982 FREE, but V=32k 0.938/0.944, V=32k+prompt 0.954/0.961, V=32k+prompt+generated 0.967/0.977, V=16k 0.869/0.879, V=8k 0.816/0.833 are NOT free (target tokens outside V: 7.4% at 32k, 15% on prose, because the vendor/+topics/ corpus is code/technical). The E3 combined design (V=32k+prompt, int4 MTP, int8 head) keeps 0.944/0.951, which the E3 step-time model with per-arm draft bytes turns into 1.51x/1.52x over stock vLLM k=3 (E3 assumed 1.56x at no loss); a 48k+prompt+generated variant is predicted (independence, not measured) at 0.976/0.982 and 1.54x/1.55x.", "confidence": "medium", "dead": "- **Private bf16 copy of the lm_head for the draft (2.37 GiB)** - the first design (fixed address for CUDA graphs) failed four times on a 24 GB card: (1) the MTP's own throw-away embed + lm_head (4.7 GiB) stay allocated until a gc cycle collection after `load_eagle_model` (fix: `gc.collect()`); (2) allocating the copy before the target compile makes Inductor's combo-kernel autotune OOM (it needs 2.37 GiB scratch); (3) allocating after the KV profile leaves no room for a 4k-token prefill; (4) `kv_cache_memory_bytes` to skip profiling OOMs the same way. Final design: the draft logits use the shared head directly, and the head arms keep an int8-stored copy (1.27 GiB) dequantised in 4096-row chunks (`HEAD_CHUNK`), which is slow (head arms took ~20 min instead of ~6.5) but fits.\n- **Assumed the draft ran inside CUDA graphs** (fixed pointers required) - with FlashInfer + spec decode vLLM falls back to PIECEWISE graphs, so `compute_logits` is eager and plain python state works; no graph rebuild was needed.\n- **Hooking `Qwen3_5MTP.forward` for the generated-token arms** broke torch.compile's dynamic-shape guards (`ConstraintViolationError: L['input_ids'].size()[0]`); moved the hook to `AutoRegressiveSpeculator._run_model` outside the compiled region.\n- **`base2` as a noise estimate** - it is a bit-exact replay (same engine/seeds), so it only proves determinism. Noise had to be estimated from near-no-op arms and bootstrap CIs.\n- **GPU lease contention**: the first full launch lost the lease to another agent and exited immediately; later the run was split (v8k+gen, comb-gen-head8, comb48-gen-head8 were defined but not run after a request to stop using the GPU; they were removed from `ARMS`; the dynamic-generated-token variant of the combined arm and the 48k combined arm exist only as an independence-based prediction).", "conclusion": "**The quantisation half of the E3 draft design is free; the 32k vocabulary half is not (with a repo-derived list).** int4-g128 RTN MTP layer (0.990/0.998), int8 MTP (1.001/1.006), int8 draft head (1.002/1.002), int4 draft head (1.000/0.997) are all within 3% and mostly within the ~1% noise, on every category (single cells down to 0.963 on agent T=1 for head-int4, 0.979 prose greedy for mtp-int4, i.e. inside the +-2% cell noise). So the int4 MTP layer (0.22 GB) and an int4/int8 draft head are safe: the prediction that int4 MTP would lose 3-8% was wrong (1.0%/0.2%); MSE-clip search is unnecessary. The restricted vocabulary is a quality/bytes trade: with the frequency list built from vendor/ + topics/, V=32k loses 6% (7.4% of the target's tokens are outside V, 15% on prose), prompt tokens recover ~1.6 points and generated tokens another ~1.5 (V=32k+prompt+generated 0.967/0.977, still just under the 3% rule on greedy), V=16k/8k lose 12-18%. V=48k+prompt+generated (0.986/0.982) and V=64k (0.994/0.990) are free; relative to 32k a bf16 head of 48k/64k rows is 0.17/0.34 GB larger (+0.19/+0.38 ms per draft step), half that at int8. The pre-registered V=32k-free bet fails; the corpus-domain explanation is measured (OOV by category) but a prose-rich or chat corpus list was not tried.\n\n**What this does to the E3 model.** Combined E3 design as measured (V=32k+prompt, int4 MTP, int8/int4 head): acceptance 0.944/0.951 of baseline, modelled 125/118 tok/s greedy/T=1 at k=3 = 1.51x/1.52x over stock vLLM k=3, versus E3's 1.56x at unchanged acceptance: the 5% acceptance loss is mostly paid back by the cheaper head. Recommended draft path for the engine: int4 MTP layer + int8 (or int4) head restricted to ~48k rows + prompt/generated tokens; predicted (independence of the three effects, whic"}, {"dir": "2026-10-31-ngram-draft-potential", "status": "done", "question": "Can prompt-lookup / n-gram drafting (copy the continuation of an earlier occurrence of the last n tokens) add speculative acceptance on top of the engine's int4 MTP head (k=3, T=4 verify) on realistic coding-agent / editing workloads whose output reuses the context (code edits, log extraction, agent tool calls) without losing on workloads that do not (free-form prose, reasoning/math), and what end-to-end decode speed-up does a hybrid draft policy give when the verify step may carry up to T=8 rows (step-time model from E3 / K5 / K7 measurements)?", "prediction": "Frozen before any engine run (workload prompts are built on CPU before the first GPU run; the policy grid is fixed below). 32 greedy generations (8 code-edit a, 6 log/tool-output extraction b, 6 agent tool-call turns c, 6 free-form prose d, 6 reasoning/math e; 384-768 new tokens; prompts 1.5-7K tokens), measured at EVERY position with the MTP head via force=[1] cycles; PLD, the policies and the cost model are simulated offline on the measured greedy continuations. PRIMARY hybrid H0 (fixed now): match the last n=4,3,2 tokens (longest n first, most recent occurrence, match length l = backward-extended agreement), use PLD iff l>=3 with up to L=7 proposed tokens (verify T=1+L<=8), else MTP chain k=3 (T=4); MTP drafts are always computed (conservative) and the host picks the graph per cycle (+0.2 ms/cycle); step times V(T)=20.20/20.72/21.08/21.55/21.93/22.68/23.26/23.85 ms for T=1..8 (K5 measured T<=4, +E3 whole-step GEMV growth +0.2 ms/row DeltaNet beyond T=4), MTP cycle overhead 1.56 ms at k=3. Everything else in the grid (n,m,L,strategy, skip-drafts, MTP+PLD tail, oracle best-of) is exploratory. BETS (pooled tokens / pooled time per class, bootstrap over tasks): (1) MTP-only measured tokens/cycle E: a 3.5, b 3.1, c 3.3, d 2.2, e 3.2 (so MTP-only modelled tok/s ~155 / 135 / 140 / 90 / 140). (2) P(PLD match l>=3 at a position): a 0.80, b 0.70, c 0.55, d 0.20, e 0.15; given a match, mean accepted run of the L=7 proposal: a 4.0, b 3.0, c 2.2, d 0.8, e 0.7; median l of matched positions in (a) >= 8 (bimodal: long copy runs vs short spurious 3-grams). (3) H0 / MTP-only modelled tok/s ratio: a 1.20 (90% CI inside 1.08-1.35), b 1.10, c 1.05, d 0.995-1.00, e 0.995-1.00 (no loss: the l>=3 gate rarely fires and a failed PLD cycle still emits >=1 token at <=T=8 cost; worst-case loss on a class <= 1%); pooled a-c 1.13. (4) PLD-only (plain T=1 step when no match) / MTP-only: a 0.85, b 0.70, c 0.60, d 0.45, e 0.45, i.e. PLD alone loses everywhere except possibly long-copy code-edit tasks, and never beats H0 in any class. (5) Restricting PLD to L=3 (T=4, no engine change beyond a host n-gram index) gives <= +4% over MTP-only on every class; most of the gain needs T>4 rows. (6) Oracle best-of per position (non-implementable upper bound: take whichever of MTP-chain / PLD gives the longer accepted run) a 1.35, b 1.25, c 1.18, d 1.08, e 1.07; H0 captures >= 70% of the (a) gain. (7) Sensitivity: the conclusion survives V(8)=26 ms (pessimistic) in class a and fails if V(8)>=28 ms; the 0.2 ms host-sync penalty costs < 1.2 points. DECISION RULE (fixed): RECOMMEND implementing the hybrid iff pooled a-c ratio of H0 >= 1.10 with bootstrap 95% CI lower bound > 1.05, each of a, b, c point ratio >= 1.05, and classes d and e point ratio >= 0.99 (CI lower bound >= 0.98). Bet: recommend = YES (60%); the class most likely to miss is c (agent tool calls: short outputs, JSON scaffolding is predictable for MTP already). Tuned-policy numbers are reported only from 2-fold cross-validation over tasks (tune n,m,L on one half, evaluate on the other) because 32 tasks and a ~100-cell grid make in-sample best-cell selection optimistic.", "answer": "Pre-registered switch hybrid H0 (PLD replaces the MTP chain when suffix match l>=3, T<=8) = modelled x1.17 / 1.03 / 1.21 (a code-edit / b logs / c agent turns, pooled a-c 1.127 [1.03, 1.25]) but x0.97 prose and x0.88 math -> pre-registered rule FAILS; the engine's MTP head already accepts 3.7-3.9 tokens/cycle on copy-heavy work (PLD first-token accuracy 0.6-0.9 vs MTP 0.97-0.99), so PLD only helps as a tail beyond T=4: MTP chain + PLD tail (T<=8, post-hoc) = x1.37 pooled a-c in-sample, x1.15 [1.06, 1.25] held-out with a no-loss constraint (d 0.995, e 1.02), break-even V(8) 33 ms; because MTP's first-token accuracy (0.97-0.99) beats PLD's (0.6-0.9) even at l >= 3; L=3 / T=4 is a loss of 11-16% on a-c.\n- **Not done:** no hybrid implemented or timed in the engine (V(T>4) is a model; the first task for an implementer); no tree / branch verification (DeltaNet's recurrent state cannot verify two branches in one step without per-branch state copies); no adaptive back-off simulated; sampling-mode acceptance of tail tokens not measured; no lm_head int8/int4+rescoring combination (E5: orthogonal, -6..-10% of V(T) would raise every ratio slightly).", "conclusion": "**Answer.** PLD alone is not a drafter for this engine (x0.80 on a-c, x0.43-0.50 on d/e). PLD *replacing* MTP by a match-length gate (the pre-registered H0) gains +17% / +3% / +21% on code edits / log extraction / agent turns but loses 3% on prose and **12% on math**, so the pre-registered rule says do not implement it. The reason is the MTP head itself: on these workloads it already accepts 3.7-3.9 tokens/cycle (87-97% of cycles accept all three drafts on copy-heavy classes), so the only thing PLD can add is depth beyond T=4, never better first tokens. The policy that captures it is **MTP chain + PLD tail (T up to 8)**: modelled **x1.15 (honest held-out, no-loss constrained, [1.06, 1.25]) to x1.37 (in-sample best cell, [1.27, 1.48]) pooled on a-c** at V(8)=23.85 ms, d 0.995-0.991 (-0.5 to -0.9%), e +2 to +5%; tok/s MTP-only 160/160/170/101/151 -> 219/211/247/100/158 (E3 cell). It satisfies the decision rule's thresholds (the rule was written for H0, this variant is exploratory and its cell choice is partly post-hoc; the held-out CV with the no-loss constraint is the number to believe). Pooled a-c stays above x1.10 up to V(8) ~ 33 ms, but the no-loss clause on d/e only holds up to V(8) ~ 27 ms; the unverified input is V(T=5..8) and the T>4 kernels. **Recommendation: implement the MTP chain + PLD tail (not H0)** as an opt-in, workload-adaptive path, after measuring V(T) for T=5..8 on the real graph (a 2-hour kernel/graph task); if measured V(8) <= 26 ms the model gives >= +25% on copy-heavy agent/edit traffic, if V(8) >= 30 ms it is <= +18% pooled on a-c and d/e start to lose (gate m must rise).\n\n**Not shown / caveats.** (i) Everything about T>4 steps is modelled (V(T), catch-up, sync); numerics of T=8 rows may flip near-ties (as K5/K7 found for T=1 vs 4), which changes "}, {"dir": "2026-10-31-spec-sampling-exactness", "status": "done", "question": "Can the swift-mk on-device MTP speculative cycle (one CUDA graph; int4 MTP layer + 64k int4 draft head; BF16 verify of 1+k rows) do sampling at the Qwen settings (T=1.0 / top_p 0.95 / top_k 20, and T=0.6 / top_k 20) with standard speculative-sampling acceptance (accept d with prob min(1,p(d)/q(d)), residual max(0,p-q)/Z on rejection, bonus from p) so that the emitted-token distribution is EXACTLY the autoregressive target distribution (chi-square on the first emitted token and the joint of the first two emitted tokens, 20000 plain samples vs the cycle, plus a deliberately broken no-residual variant that must fail), what does it cost per cycle (top-k over 248k fp32 logits x (1+k) rows + draft-head top-k + RNG, all in-graph), and which draft proposal gives the longer accepted length at T=1: q = the draft head's own filtered distribution (sampled drafts) or the greedy-draft delta (accept w.p. p(d))?", "prediction": "Frozen before any run. (1) Exactness: for the exact variant every chi-square / two-sample test on the top-20 candidate cells (pooled cells with expected count < 5) gives p > 0.01 (bet: all p-values look uniform on (0,1); the smallest of ~10 tests > 0.005), total variation vs the reference < 0.02 at N=20000 (sampling noise floor ~0.01), and no emitted token ever lies outside the target top-20 support. The broken variant (accept w.p. min(1,p/q) but on rejection resample from p instead of from the residual) FAILS: p < 1e-6 on the first-token test for the low-acceptance prose prompt (TV ~0.05-0.10) and p < 0.001 on the other prompts. top_k/top_p semantics equal transformers' Temperature->TopK->TopP warpers exactly on random and peaked logit vectors (same support, probabilities within 1e-6). (2) Sampling kernel cost per cycle (target rows 1+k=4: two-stage block top-k over 4 x 248320 fp32 + softmax/top-p + accept/residual/philox kernel): 0.05-0.12 ms (< 0.15 ms bet 0.08 ms); each draft-head top-k+sample over the 64k logits 10-20 us. So the cycle grows by < 0.5% (24.2 -> ~24.5 ms at k=3). (3) Accepted length at k=3, T=1/top_p0.95/top_k20 with sampled drafts (q = draft head filtered with the same T/top_k/top_p): code 3.00 (2.7-3.3), prose 1.95 (1.7-2.2), math 3.10 (2.8-3.4), 8K 2.65 (2.4-2.9); greedy-draft delta variant is lower on every prompt: code -4%, prose -9%, math -4%, 8K -6% relative (sampled q wins because sum min(p,q) >= p(argmax q) whenever q ~ p). tok/s at k=3 (sampled drafts): code 123, prose 80, math 126, 8K 105 = 1.43x / 1.41x / 1.43x / 1.38x of the E0 vLLM T=1 references (86.0 / 56.9 / 88.1 / 76.0); k=2 and k=1 are lower in the same order as greedy (k=1 ~86 / 74 / 87 / 79 tok/s minus 5%). T=0.6 raises accepted length ~8% over T=1.", "answer": "Yes: temperature/top-k/top-p sampling with exact speculative verification runs inside the CUDA graph at +0.11 ms/cycle (0.5%): T=1 top_p .95 top_k 20 k=3 = 144.5 / 90.5 / 150.3 / 124.9 tok/s on code/prose/math/8K = 1.68 / 1.59 / 1.71 / 1.64x the E0 vLLM T=1 numbers (86.0 / 56.9 / 88.1 / 76.0), accepted length 3.34 / 2.09 / 3.47 / 2.99; kernel-level (2e6 cycles) and end-to-end (20000 samples, first two tokens) chi-square tests pass (p 0.04-0.96 / 0.12-0.44) and the no-residual variant fails them (p < 1e-57); sampled drafts beat greedy drafts by 0-4% of E at k=3 (9% of first-draft acceptance on prose); T=0.6 does not lengthen acceptance.", "confidence": "medium", "dead": "* e2e at `--extra 6` (prose) and `math --extra 10`: the tested position had a single-token support (p1 = 1.0), so the test had no information (20 min of GPU time); positions are now picked from an entropy scan.\n* Reference from the T=1 engine step: invalid for T=0.6 (numerics of T-row vs T=1 kernels, above); kept as a diagnostic line in the analysis.\n* First top-k kernel (block-argmax K times per 2048-logit chunk + 1024-thread merge): 41 + 50 us per call (two 32-warp reductions per extracted element); thresholded stage 1 + 128-thread merge: 30 us.\n* Lane-0-only shared stores inside the warp-level accept loop deadlocked the kernel (shuffles with divergent lanes) after 4 correct cycles; all lanes now store.\n* Draft proposal temperature 0.85 / 0.7 instead of T: no consistent gain (prose +6%, code/math -1..-2%, single seed).", "conclusion": "Exact on-device speculative sampling works and is almost free; the spec cycle at the Qwen sampling settings is 1.6-1.7x stock vLLM at T=1 (vLLM's own greedy-draft rejection sampler), with greedy and sampled throughput within 5%.\nAgainst the prediction: exactness, power (broken fails with TV 0.13-0.19 rather than 0.05-0.10), HF/vLLM semantics (max |dp| 2.7e-7), kernel cost (0.045 ms target rows < 0.15; drafts 18-23 us each, slightly above 10-20 us; cycle +0.49%) hold. Wrong: accepted length and speed were underestimated (E 3.34 / 2.09 / 3.47 / 2.99 vs 3.0 / 1.95 / 3.1 / 2.65; ratios 1.59-1.71x vs 1.38-1.43x; the engine also got ~5% faster from K5's GEMV work between measurements); delta drafts are 0-4% of E lower, not 4-9% (prose: equal, only the first-position acceptance differs, 0.61 vs 0.70); T=0.6 did not raise E (it lowered it by 1-4%). The statement \"all p > 0.01\" held only after fixing the reference: the plain T=1 engine step differs from the T=1+k row verify step by ~0.05 in logits (TV 0.007 / 0.024 first token at T=1 / T=0.6), which made the e2e test fail at T=0.6 (p = 2e-7) against the T=1-step reference; compared against the same T-row numerics the sampler passes (see BENCH.md)."}, {"dir": "2026-11-01-hyperqwen-vs-swift-mk", "status": "done", "question": "Served on the SAME checkpoint (Swift-1.5 INT4) with the SAME HTTP client and prompts on the same 3090, how does HyperQwen (vLLM 0.30 patch series: MTP k=4 with int4 heads + 40k draft vocab, DFlash2 block drafter, lookup drafting, KVarN/int8/fp8 KV) compare with swift-mk on decode tok/s (greedy / T=1), TTFT (20 tok / 8K), concurrency 1-8, context 28k-100k and greedy-output parity, and which HyperQwen techniques are worth porting into swift-mk?", "prediction": "Pre-registered 2026-11-01 before any measurement (only a CPU weight-similarity check was run: Swift's embed/lm_head/MTP equal the base Qwen3.8 ones up to quantisation error). Greedy decode tok/s, HTTP, 385 tokens, E0 prompts code/prose/math/8K, this card at 350 W: swift-mk (k=3 + --prompt-lookup auto) 160/103/160/135; HQ SPEC=mtp CTX=fast (k=4) 125/88/120/90; HQ SPEC=dflash2 (7 drafts) 130/92/128/85 (DFlash2 acceptance on Swift within 5% of base: 3.1-3.4 tok/step; window of 2048 tokens hurts at 8K). swift-mk beats HQ's best exact mode on >=3 of the 4 E0 prompts by 1.15-1.5x (P=0.75). E6 classes a-c pooled greedy: swift-mk 240, HQ DFLASH_TOKENS=15 200 (range 150-290), HQ mtp 140; swift-mk wins a-c with P=0.7. TTFT: swift-mk 38 ms at 20 tokens vs HQ 70 ms (50-130), 8K 3.9 s vs 5.3 s (4.5-6.5, INT8_ACT off). Concurrency: swift-mk aggregate flat (FIFO bs=1); HQ MTP aggregate x1.6/x2.3/x3.0 of its C1 at C2/C4/C8, so HQ wins aggregate at C>=2 by >=1.5x at C4. Long context: HQ CTX=long on Swift serves 28k/56k/100k prompts (P=0.75), decode ~85/70/55 tok/s, 100k prefill >= 100 s; swift-mk refuses >28672 bf16 / 53248 fp8. Parity: 30 prompts, first 128 greedy tokens identical in 16/30 (10-24), mean first-divergence position >= 70, because HQ verifies with an int4 lm_head (no exact rescoring) and fp16 recurrent state. Adoption ranking expected: (1) int4/int8 KV or KVarN for 100k+ context, (2) multi-sequence verify batching only if concurrency is a goal, (3) DFlash2-style drafter only on copy-poor prose (unlikely to beat MTP chain + PLD tail), (4) int8 activation prefill (+13-30% prefill, +4% PPL cost), (5) calibrated draft vocab (we already have).", "answer": "On our Swift-1.5 weights at 350 W through one client, HyperQwen DFlash2 (7-token block drafter) is x1.53 / x1.36 faster than swift-mk on E0 code / math (254 / 225 vs 166 / 166 tok/s), x1.14 on E6 a-c and x1.24 on E8, same ~22 ms step but 5.2-5.8 vs 3.5 tokens per step; HyperQwen MTP ties us (174 / 104 / 177 vs 166 / 107 / 166); swift-mk wins TTFT (39 vs 53-56 ms; 8K 3.9 vs 4.2 s) and exact greedy (parity with HyperQwen only 7 / 30 E8 prompts over 128 tokens); context / concurrency / DFLASH_TOKENS=15 not measured (stopped; dflash15 did not serve); adopt a DFlash2-style drafter first", "confidence": "medium", "dead": "- **`DFLASH_TOKENS=15` (`dflash15`, the 381 tok/s claim) did not serve**: both rounds booted (176 s cold / 34 s warm), `/health` came up, the first warm-up request returned HTTP 200 but the SSE stream carried no `token_ids` chunk (client: `RuntimeError('no tokens')`). Not diagnosed (the container log shows only `POST /v1/completions 200 OK` lines and an `expandable_segments ... OOM while trying to map 20 MiB (free 34 MB)` allocator warning also present in the working `dflash2` boot, `runs/hq/logs/container-215816.log`); candidates: this checkpoint's weights are 1 GB lighter than the constants behind the 4-slot / 56k profile (`KV_MEM` is pinned in bytes), the lookup-filled 16-token block with `return_token_ids`, or the adaptive block under `--no-async-scheduling`. The `DFLASH_TOKENS=15` row of the gap table is therefore *unknown*, not \"worse\".\n- **Stopped early (human, \"wrap up now\") before round 3, the concurrency sweep, long-context (28k / 56k / 100k), `CTX=long` / `huge`, TTFT sweep, ours-fp8**: the harness (`run.py visit <server> --suite conc|long|ttft`) and `hq.sh` configs (`mtp-long`, `mtp-huge`, `dflash2-huge`) exist but never ran.\n- **Prediction miss, not a bug**: I expected HyperQwen at 250 W-class claims (121-131 tok/s C1 from its docs) and priced it at 125 / 130 tok/s on E0 code; at 350 W on code-like prompts it ran 174 / 254. Their 127 tok/s headline is a chat-cohort figure (8 prompts of 45-300 tokens, 1,024-token answers), not a code prompt; the E0 code prompt is a memoised-Fibonacci snippet that the model writes with high predictability.\n- **K11's \"240 tok/s\" pooled a-c did not reproduce** through this client (197 pooled median at 256 new tokens; class c 240 does match). Different aggregation (K11: mean over longer outputs, engine-direct) and the HTTP client; not chased.\n- **Heads / vocabulary / drafter were not recalibrated on Swift-1.5** (GPTQ capture ~74 GB scratch, hours): base-model artefacts reused after checking on CPU that Swift's embed / lm_head / MTP are the base model's (relative error equals pure quantisation error). HyperQwen's own docs say the recalibration is \"the stronger option\".\n- Process: `pkill run.py` left the swift-mk server of the aborted round-3 visit running (orphan, killed by hand, GPU back to 420 MiB); `hq.sh stop` first overwrote a single `last-container.log` so the first `dflash15` container log is lost (fixed for later visits); the `grep -v` in the driver block-buffered the log so the first visits were invisible f", "conclusion": "**Answer.** On our own Swift-1.5 INT4 weights, through one HTTP client and 350 W, HyperQwen is *not* the slow baseline the pre-registered prediction assumed. Its MTP mode ties swift-mk on E0 (code 174 vs 166, prose 104 vs 107, math 177 vs 166, 8K 139 vs 131 tok/s) and its **DFlash2 mode is x1.53 / x1.36 faster on E0 code / math (254 / 225 tok/s), x1.14 on E6 agent / log / edit tasks and x1.24 on the 48 E8 English tasks**, at the same ~22 ms step, because a one-pass 7-token block drafter delivers 5.2-5.8 tokens per step where our MTP chain delivers 3.5; on prose all three stacks tie (103-107 tok/s). swift-mk wins TTFT (39 vs 53-56 ms short, 3.9 vs 4.2 s at 8K), deterministic exact greedy against a bf16-rescored head (HyperQwen's greedy output differs from ours within 128 tokens on 23 / 30 E8 prompts) and class-c agent turns (240 vs 229). Context (HyperQwen pool 85k bf16 tokens vs our 28,672) and concurrency are HyperQwen's by design; their long-context decode rates and the 381 tok/s copy ceiling were **not measured** (stopped by the human; `dflash15` failed to serve). The pre-registered prediction \"swift-mk wins >= 3 of 4 E0 prompts by 1.15-1.5x\" is **refuted** (1 of 4). The most valuable thing to take from HyperQwen is the DFlash2 block-drafter architecture (est. x1.3-1.5 on code / math [I]), then a VRAM diet that buys context for free, then quantised KV.\n\n**Confidence: medium** for the single-stream decode / TTFT ordering (two interleaved rounds, spread <= 1%, same client, same power class), **low** for everything about context, concurrency, copy-ceiling and parity cause (unmeasured or one-sided)."}, {"dir": "2026-11-01-kv-pointer-draft-potential", "status": "done", "question": "Can the model's own stored state (R1: where its 16 full-attention layers x 24 heads attend in the context; R2: cosine kNN of the final-norm / intermediate hidden states of all earlier positions, incl. key-like projections) draft tokens that exact n-gram lookup (R0 = K11's m=3 longest-suffix prompt-lookup tail, <=4 tokens after the MTP k=3 chain) misses, on E6's 32 greedy tasks (a code edit 8, b logs 6, c agent turns 6, d prose 6, e math 6): precision of the next token and copy run (anchor-consistent pointer, implementable at drafting time = the row that produced the anchor), coverage at precision >= 0.9, extra accepted tokens per cycle over MTP chain + R0 tail, modelled tok/s with K11's measured cycle costs V(T=1..8) for MTP+R0 / +R1 / +R2 / +best-of, d/e must not lose, and what would the engine need (device-side top-1 pointer epilogue, hidden store + cosine search kernel: ms per cycle at 8K/32K)?", "prediction": "Frozen before any engine run. Definitions: cycle i has anchor ain run <3 in a-c (about 10-13%), the confident R1 draft is correct at the first MTP-miss slot in 15-25%. (7) >= 5 decoded examples (renamed identifier / reformatted copy) where R1 is right and R0 has no proposal exist in the 32 tasks (P=0.8) but are < 2% of positions. (8) Decision: do NOT implement pointer/kNN drafters on top of the exact PLD tail (P=0.7); P(best-of >= 1.05 pooled over MTP+R0 with CI lower bound > 1.0) = 0.2. (9) Costs (estimates, micro-benchmark within +-30%): hidden-state cosine search of one query against 8K / 32K stored 5120-d bf16 states is bandwidth bound, 0.10 / 0.40 ms per cycle (0.5% / 2% of a 21 ms cycle), the store is 10 KB per position vs 65 KB KV; a top-1 pointer epilogue in the attention split kernel is < 1% of the attention time.", "answer": "No: the model's own state (attention pointers of 34 of 384 heads, final-hidden kNN) predicts the copy source it is using at precision 0.91-0.99 on 12-75% of copy-text positions, but it is the same information exact n-gram lookup already has: over K11's MTP chain + exact tail (modelled with K11-measured cycle costs, reproducing its A/B within 1.6%) pointer tail x0.965 [0.949, 0.980], hidden kNN x0.880, best-of x1.000 [0.998, 1.003] on a-c (d/e 0.998/0.997), hindsight oracle over all three x1.010 and over EVERY earlier occurrence of the anchor only x1.043; fuzzy copies (renamed identifiers, changed numbers) are real but ~1% of positions and sit where MTP is already wrong; cosine search costs 0.105 / 0.42 ms per cycle at 8K / 32K (measured); do not implement", "confidence": "medium", "dead": "- **Hidden-state kNN at intermediate layers and middle keys (layers 48/32, keys 47/31)**: centred, raw, z-scored or normalised-then-centred cosine never reaches 0.9 first-draft precision at any threshold (the residual stream at those depths mostly encodes the current token and position, not the next one); the z-scored / normalised variants (second collect) change the final-norm and layer-60 results by < 0.02 coverage.\n- **Calibrating a vote by summed mass**: coverage at precision 0.9 is non-monotonic in the number of heads (top-4 .42 pooled a-c, top-16 .17, top-384 .035) because the sum scales with M; I did not search for a normalisation (the policy-level and oracle-level results do not depend on it).\n- **Pointer next token without the anchor** is a different question from drafting after the anchor: it looks impressive (precision 0.96 at 68% coverage, a) but the anchor is already known, so it adds nothing; the drafts need the *continuation* of the source, which head mass does not certify.\n- **Replacement of the MTP chain** by a confident pointer that disagrees with MTP: the throughput-tuned selector chose 'never' in one fold; the other fold's gain does not transfer (x0.999 pooled).\n- **Process mishaps (no effect on the data)**: the first collect launch died with the tool's background job (restarted detached; the probe is deterministic so the first two tasks were reused); the second collect (z-scored variants) was first launched in a command chain whose lease acquisition failed (the lease was held by another job) but the chain continued: the process died at weight load with a CUDA OOM (the other process had 19.6 GiB) before any kernel of mine ran, then was replaced by a script that waits for the lease and checks the acquire exit code; the second collect (10:01-10:11) reproduced every number of the first bit-for-bit (all R0 / R1 / old R2 tables identical, the CI draws too) and added the z-scored / normalised variants, so `results/` is from it; a name clash between this experiment's `analyze.py` and E6's was avoided by importing E6's through `sys.path` order.\n- **Not done**: no engine A/B of an R1/R2 drafter; no sampling mode; no FP8 KV; no learned selector; the epilogue cost is an estimate.", "conclusion": "**Answer.** The model's attention does know where it is copying from: 34 of 384 heads (mostly the last attention layers, offsets -1 / 0 / +1) point at the anchor's n the real engine (private library copy that lifts the chain limit to 7): how much do chain depths k = 3, 4, 5, 6, 7 add per class (E0 code / prose / math / long8k, E6's 32 tasks in classes a-e, E8's 48 English chat tasks), greedy and T=1 sampling, with and without the prompt-lookup tail (tail shrinks to 7 - k tokens: the interaction), what are the per-position acceptances a_1..a_7 and the cycle ms vs k, and can a confidence gate (stop the chain at depth j when the draft distribution's max-prob < tau_j, verify width chosen per cycle from the confidence profile, tau cross-fit by task) make a deep chain never lose (classes d / e must not lose vs fixed k = 3)?", "prediction": "Frozen before any deep-chain measurement (this commit). Costs (modelled from K11 BENCH parts, ctx ~64, plus 0.42 ms per extra chain draft = BENCH K4 draft 0.43 ms): cycle ms at k = 3 / 4 / 5 / 6 / 7 = 20.7 / 21.6 / 22.7 / 23.8 / 25.0 (+1.05 +- 0.15 ms per depth: ~0.42 draft + ~0.6 verify row); the confidence kernel adds < 0.05 ms per cycle. Per-position CONDITIONAL acceptance beyond k = 3 (single layer reused: its input hidden is its own output, so decay is steeper than the 3-token data 0.93 / 0.94 / 0.84 on code): code / math c4 = 0.70, c5 = 0.65, c6 = 0.62, c7 = 0.60 -> unconditional P(>= 4 / 5 / 6 / 7) = 0.50 / 0.33 / 0.20 / 0.12 (80% interval for P(>=5): 0.20-0.50); prose c4 = 0.50, c5 = 0.45 -> P(>= 4 / 5) = 0.10 / 0.045. Tokens per cycle E (greedy, E0 prompts) k = 3 / 5 / 7: code 3.5 / 4.3 / 4.6, math 3.45 / 4.3 / 4.6, prose 2.28 / 2.43 / 2.46. Fixed-k tok/s vs k = 3 (no tail, greedy): code / math k = 4 +7%, k = 5 +8% (50% interval +4..+14%), k = 6 +8%, k = 7 +5% (best fixed depth: 5 with prob 0.5, 4 or 6 with 0.25 each); prose k = 5 -2.5% (interval -5..0), k = 7 -5%; E0 long8k between code and prose (k = 5 +2%). Tail interaction (k = 5 leaves tail <= 2, k = 6 tail <= 1, k = 7 none): on E6 classes a-c (copy-heavy, shipped k = 3 + tail 4 = x1.38 vs k = 3) k = 5 + tail <= 2 is WORSE than k = 3 + tail 4 by 7% (x0.93, interval 0.88-0.99) - the deep chain does not stack with the tail; on E6 d / e / E8 prose k = 5 + tail <= 2 vs k = 3 + tail 4: d x0.97, e x1.03. E8 English gains like a prose / code mix (+3% at k = 5). Sampling (T=1) gains are 1-2 points lower than greedy at the same k. Confidence gate: max-prob of the draft head predicts acceptance (AUROC of conf_2 for 'draft 2 accepted | draft 1 accepted' 0.75-0.82). Offline cross-fit gate (verify width from per-depth tau_j, drafting depth K fixed): the draft cost of the unused depths is sunk (0.42 ms x (K - 3) = +2% per depth), so on prose a width-only gate at K = 5 recovers only to -1.0% vs fixed k = 3 (interval -2.5..+0.3), NOT to >= 0; with an adaptive draft depth (host picks the next cycle's K in {3, K} from the recent confidence profile) prose >= -0.3% (prob 0.6); code / math keep >= 90% of the fixed-k=5 gain, and a gated K = 6-7 beats the best fixed k on code / math by 1-2 points (+9..+10% vs k = 3). Classes d (prose) and e (math) with the tail on: gate + adaptive depth ends within [-0.5%, +4%] of k = 3 + tail 4 (prob 0.55 that BOTH are >= 0.995 measured); on a-c the gate cannot beat k = 3 + tail 4 (<= x1.00). Modelled vs measured gate gain within 1.5 points (the offline per-cycle model ignores trajectory shifts).", "answer": "Measured (real engine, private patched lib, greedy, 132 tasks, deep driver == committed k=3 to 0.2%): a deeper MTP chain is worth much more than the k=3 default assumed - tok/s vs k=3 at k=4 / 5 / 6 / 7: E0 code x1.12 / 1.20 / 1.18 / 1.23, E0 math x1.11 / 1.14 / 1.20 / 1.14, E6 a code edit x1.14 / 1.24 / 1.32 / 1.35, b log x1.17 / 1.29 / 1.36 / 1.41, c agent x1.20 / 1.33 / 1.45 / 1.57, e math x1.11 / 1.18 / 1.20 / 1.19 (CI +-0.03-0.07), E8 English x1.06 / 1.07 / 1.06 / 1.04; prose loses beyond k=4 (E0 prose x1.01 / 0.96 / 0.91 / 0.85, E6 d x1.00 / 0.99 / 0.96 / 0.90): k=4 is >= 0.996 on every class (free win), cycle ms 20.9 / 21.8 / 22.9 / 24.0 / 25.2 for k=3..7 (+1.06 ms per depth; one extra draft 0.52 ms, one verify row ~0.55 ms). Confidence (draft head max-prob) predicts acceptance well (AUROC 0.89-0.91 at every depth), but a verify-width gate cannot recover the sunk draft cost: MODELLED cross-fit (4 folds by task): width-only gate K=5 prose x0.966 / E6 d x0.990; width gate + adaptive draft depth (EMA of accepted drafts, K=7 else 3) keeps prose x0.989 / d x0.998 / e x1.20 / code x1.23 / a-c x1.41-1.59. NOT RUN (lease contention, parent wrap-up order): prompt-lookup tail interaction, online gate, T=1 sampling, gate exactness test.", "confidence": "medium", "dead": "- First `cost_grid` crashed the process (`illegal memory access`): replaying hundreds of cycle graphs on one state advanced the context past `ctx_max`; fixed by `set_force([1])` + `snapshot()` / `restore()` before every cell (the smoke run caught it before the big run, but the lease went to another tenant for 30 minutes).\n- A width-only confidence gate: modelled, does not fix prose (sunk draft cost), see 5; the `kept >= L` adaptive rule (`a3`) and the `rho` rule (`a3r`) recover less than the EMA rule (`a3e`).\n- Background jobs started with `nohup ... &` inside a tool call were killed when the call ended (twice, silently); only `setsid nohup` survived.", "conclusion": "**The k = 3 default is too shallow for everything that copies or computes, and too deep nowhere below k = 4.** On the real engine (greedy, same graphs, same host loop, 132 tasks) k = 4 is a pure win: no class below x0.996 (E0 prose x1.012, E6 d x0.996 [0.970, 1.029]) and +5..+20% elsewhere (E0 code +12%, E6 a / b / c +14 / +17 / +20%, e +11%, English +6%) for +0.9 ms per cycle. Deeper keeps paying on code / math / copy (k = 7: E6 a / b / c x1.35 / 1.41 / 1.57, e k = 6 x1.20) and loses on prose-like work (k = 5: E0 prose x0.957, E6 d x0.991, E8 prose-type tasks x1.012; k = 7: x0.85 / x0.90), with long8k at k = 5 (+6.9%). The per-class optimum differs by 3 depths, so the best static default is k = 4 (never loses) and the best system is an adaptive controller; modelled with a cross-fitted EMA depth controller + a confidence width gate it keeps prose / d within 0.2-1.1% of k = 3 while taking x1.20-1.59 on e / a-c - a model, not yet measured.\n\n**Scorecard** (prediction frozen in `667757c`):\n\n| bet | outcome | verdict |\n|---|---|---|\n| cycle ms k = 3..7 = 20.7 / 21.6 / 22.7 / 23.8 / 25.0, +1.05 +- 0.15 ms per depth | 20.89 / 21.81 / 22.90 / 23.98 / 25.18 (wall, E0), replays 20.8-20.9 / 21.7 / 22.7-22.8 / 23.8-23.9 / 25.0-25.1; +1.06 per depth | HIT (within 0.2 ms); the 0.42 ms per draft assumed was 0.52 ms, offset by a cheaper verify row |\n| confidence kernel < 0.05 ms per cycle | stage kc = 3 1.60 ms vs K11's 1.55 (not isolated; no conf-off graph timed) | UNTESTED, borderline |\n| code / math P(>= 4 / 5 / 6 / 7) = 0.50 / 0.33 / 0.20 / 0.12 (P(>=5) interval 0.20-0.50) | E0 code 0.62 / 0.50 / 0.34 / 0.27, E0 math 0.53 / 0.36 / 0.31 / 0.20, E6 e 0.55 / 0.43 / 0.35 / 0.26 | MISS (above, mostly at the edge of the interval): the single layer reused autoregressively decays slowly |"}, {"dir": "2026-11-01-pld-tail-engine", "status": "done", "question": "Does the MTP chain (k=3) + prompt-lookup tail (up to 4 n-gram tokens, verify T<=8 rows) pay off IN THE ENGINE, as E6 (ngram-draft-potential) modelled: (1) what does the real verify step cost V(T) for T=1..8 (K9 int4 head + exact rescoring, DeltaNet ring of 9 slots, attention T>4, W4 mma GEMV T<=8) at ctx ~64 / 2K / 8K, i.e. is E6's modelled V(8) ~ 21.7 ms (V(4)+2.3) right and below its no-loss limit (~27 ms) and the dead-idea threshold 30 ms; (2) what do the host-chosen per-width graphs cost per cycle (host sync + lookup + launch gap); (3) end-to-end greedy and T=1-sampling tok/s per workload class (E0 prompts and E6's 32-task workload, classes a-e) with the tail policy vs the committed engine, accepted lengths vs E6's offline simulation, VRAM / max-model-len cost of the 9-slot ring; (4) is greedy output equal to plain greedy (near-tie rule) and is sampling still exact (chi-square incl. the broken-variant power check) when tail tokens are delta proposals?", "prediction": "Frozen before any engine measurement of T>4 (the engine at HEAD supports T<=4; this prediction is committed before the first V(T>4) run). (1) Verify step V(T), ms, plain step incl. K9 int4 head + R=16 rescoring, ctx ~64: V(1..4) = 18.1 / 18.55 / 18.9 / 19.4 (K9 numbers, reproduced within 2%), V(5) 19.9, V(6) 20.5, V(7) 21.1, V(8) 21.7 (each +-0.7; E6 model = V(4) + E3 GEMV growth + 0.2 ms/row DeltaNet snapshots + 0.02 ms/row attention); the growth is split ~55% W4 GEMVs, ~35% DeltaNet snapshot writes ((1+T) x 151 MB per layer set), ~10% head/attention/other. ctx 2K: +0.2 ms, ctx 8K (bf16 KV): +0.8 ms at every T. P(V(8) at ctx 64 < 25 ms) = 0.85, P(V(8) < 30 ms: idea alive) = 0.97; P(V(8)-V(4) <= 3.0 ms) = 0.8. DeltaNet kernel T=8 (ring 9): 2.0 +- 0.3 ms per 48-layer step (K1 T=4: 1.15), attention T=8 16 layers at 8K bf16: 0.95 +- 0.1 ms (T=4: 0.885). (2) Host-chosen graph per cycle (sync, n-gram lookup, tail H2D, graph launch with a spin-polled mapped result, C++ loop): GPU idle gap 0.05-0.15 ms per cycle (0.2-0.6% of the cycle), so a device-side lookup is not needed; per-cycle sync costs <= 1% on prose. (3) Greedy tok/s with the tail policy (E6's best cell: n=2 longest suffix match of d2 d3 ending the chain, match length >= 3, tail <= 4, so T = 7 or 8 on a match, else T = 4) over the committed engine (same process, interleaved): E6 workload a / b / c = x1.25 / 1.20 / 1.30 (pooled a-c x1.25, 80% interval 1.10-1.40; E6 in-sample modelled 1.37 / 1.32 / 1.46, CV 1.15), d (prose) >= 0.985, e (math) >= 1.00 with an adaptive back-off; E0 prompts: code +5..+15% (167.8 -> ~185), prose +-1%, math +-2%, 8K prompt +-3%. Tokens/cycle on tail cycles within 5% of E6's offline simulation. Sampling (T=1, top_k 20, top_p .95): same ratios within 0.05. Max-model-len with the 9-slot ring (+0.62 GiB): bf16 KV 36864 -> ~28000 (rounded to what fits), fp8 65536 -> ~49000; default stays at tmax=4 (5 slots) unless the A/B passes. (4) Greedy output with tail equals plain greedy on E0 prompts except documented rounding near-ties (top1-top2 margin < 0.4); forced partial acceptance up to 8 rows passes; sampling chi-square (first-token and joint, 20000 samples) p > 0.01 and the broken variant (resample from p instead of the residual at a tail position) fails with p < 1e-6. Default decision: ON by default for greedy and sampling iff pooled a-c >= +5% and d, e >= -0.5%; my bet is that it is turned on (65%), the miss modes being V(7..8) above 25 ms or a d-class loss from the gate-pass tails on prose.", "answer": "MTP chain + prompt-lookup tail (T = 4 + <= 4 rows, one CUDA graph per width, host-chosen per cycle with < 10 us of gap) is implemented, exact (greedy == plain greedy, K7 sampling chi-square incl. broken-variant power) and measured: V(8) = 21.6 ms (V(4) 19.6; E6 modelled +2.3 ms, measured +1.98 at ctx 64, +2.32 at 8K), E6 workload greedy a / b / c / d / e = x1.389 / 1.329 / 1.461 / 1.014 / 1.072 (pooled a-c x1.381 [1.29, 1.49], 240 vs 175 tok/s), T=1 sampling x1.359 / 1.315 / 1.426 / 1.004 / 1.072 = E6's model within 1.5 points on a-c; copy-poor E0 prompts x0.98-1.02 (8K summary prompt -2% at gate m=3, x1.005 at m=4); +0.62 GiB for the 9-slot ring (max-model-len bf16 36864 -> 28672, fp8 65536 -> 53248); server default: on (auto, iff the max-model-len fits)", "confidence": "medium", "dead": "- **Adaptive width** (online EMA of the tail's net gain = accepted tail tokens - 0.3, skip 8..64 cycles when < 0): implemented in the cycle loop, A/B'd on E6 (a x1.344, b x1.327, c x1.455, d x1.001, e x1.047 vs 1.389 / 1.329 / 1.461 / 1.014 / 1.072 without) and removed; a5 loses its gain (x1.04 vs x1.22) because a tail with 20% success is still worth 4 tokens per success. The replay grid (`results/policy_sim.log`: gate x tail length x two back-off families) never beats the plain cell on a-c, and by at most 0.6 points on d or e (a 1-3 token tail).\n- **Device-side n-gram lookup / conditional graph nodes**: not built; the measured host round trip is < 10 us per cycle.\n- **Attention T=6..8**: 5..6 warps per kv head (NT = 5 / 6, KS = 1) is latency bound (fp8 8K T=5 0.62 ms -> T=6 0.92 ms); KS = 2 would need 320-384 threads and a 170-204 register cap against 238 used. Costs 0.2-0.35 ms of V(8) at 8K; not pursued.\n- **Lazy graph capture of the tail widths** failed with cudaErrorMemoryAllocation inside a request at max-model-len 28672 (the torch allocator holds the free memory): the widths are captured when the proposer is enabled (`smk_spec_pld_prewarm`).\n- Gate sweep: m = 4 / 6 trade a-c (-2.5% / -4.5% in the replay) for prose / 8K safety; not adopted (m = 3 is E6's cell and the best on the target classes).\n- First `trials-pld` run printed `p = nan` for the first tail position at top_p .95 (a single residual outcome, df = 0) and still passed by luck of `min` over a list with nan: fixed to treat df = 0 as \"only d_t-never-emitted is testable\".", "conclusion": "**The hybrid works as E6 modelled and the model's costs were right.** V(8) = 21.6 ms (+2.0..2.3 ms over V(4)), the host round trip is free (< 10 us), and on E6's workload the MTP chain + prompt-lookup tail decodes **x1.38 faster on code edits / log extraction / agent turns (240 vs 175 tok/s; 326 tok/s when the output copies the input)**, x1.01 on prose and x1.07 on math, with exact greedy output and exact sampling (x1.36 / 1.00 / 1.07 at T=1). The speed-up equals E6's in-sample figure, not its held-out one \u2014 but note the cell was selected on these same 32 tasks, so the a-c ratios are in-sample for the policy choice (E6's held-out estimate was x1.15); what is newly measured is the cost side (V(T), host gap, catch-up), which is what E6 could not verify. Copy-poor prompts are neutral to slightly negative at gate m = 3 (E0 prose -1%, 8K summary -2%, class f of six 6K-token summary prompts +2.1% overall with one task at -5%); m = 4 removes those losses and costs ~2% on a-c.\n\n**Default decision.** The engine default stays `tmax = 4` (5-slot ring, no VRAM cost, T <= 4 only); the hybrid is a flag (`Engine(tmax=8)` + `enable_pld()`). The server's `--prompt-lookup` is **auto**: on iff `k = 3` and `--max-model-len` fits next to the 9-slot ring (28672 bf16 / 53248 fp8; the server default `--max-model-len` becomes 28672, 32768 with `--prompt-lookup 0`). Criteria (>= +5% on a-c, no loss on d / e) hold on E6's classes; the price is -8.2K tokens (bf16) / -12K (fp8) of context."}], "ideas": [{"file": "PROGRAM.md", "title": "Fastest single-3090 decode of Swift-1.5-Qwen3.8-27b-INT4 (W4A16 g128 + MTP): does a fus...", "status": "active", "attempts": "- 2026-10-30 \u2014 source study (open-jet, tpu-megakernels, vLLM integration map) done; E0/E1 pending (weights download is slow: wifi only).\n- 2026-10-30 \u2014 E1 w4-stream-persistence-vs-graph done (medium): on sm_86 PDL is impossible (ptxas rejects griddepcontrol); per-op kernels in a CUDA graph already reach 795 GB/s (89% of 891 GB/s copy peak, 18.96 ms/step for the 15.09 GB, 338 phases); persistent + cross-barrier ring prefetch 809 GB/s (+2.5%, kill criterion <5% triggered); grid barrier 0.7 us. Consequence: persistence is not the lever. Program = fused kernel set in a CUDA graph (plain-decode ceiling ~19 ms = ~52 tok/s incl. nothing but GEMVs), then MTP verify (T=2-4 rows), lm_head bytes, DeltaNet/attention kernels, vLLM integration. See [experiments/2026-10-30-w4-stream-persistence-vs-graph/README.md](../experiments/2026-10-30-w4-stream-persistence-vs-graph/README.md).\n- 2026-10-31 \u2014 E0 vllm-swift-int4-bs1-baseline done (medium): stock vLLM 0.30 k=0 46.8 tok/s (76% of roofline; predicted 34, wrong), MTP k=3 96 tok/s greedy on code (3.59 tok/step) but 63 on prose; k=3 step 37 ms vs 21 ms plain, ~12 ms of it is full-vocab BF16 draft heads. Plain-decode headroom <=12-26%; the prize is a cheap draft + near-free multi-row verify (est. ~1.6x on code, [INFERENCE]). E2 (dataflow-fused-phases) and E3 (w4-multirow-verify-and-power) were cancelled by the human mid-run: no results, folders hold pre-registered predictions + partial code. See [experiments/2026-10-30-vllm-swift-int4-bs1-baseline/README.md](../experiments/2026-10-30-vllm-swift-int4-bs1-baseline/README.md).\n- 2026-10-31 \u2014 E3 w4-multirow-verify-and-power done (medium; rerun after cancellation): mma.sync W4 g128 kernels, L2-cold. Verify rows are cheap but not free: x vs T=1 at T=4/8/16 gate|up 1.02/1.12/1.45, down 1.04/1.12/1.46, qkv|z 1.05/1.15/1.46, o_proj 1.01/1.05/1.30, lm_head 1.014 (prediction \"flat to T=8\" falsified; cause = per-warp activation re-fetch through L1, HMMA pipe only 16-31% busy; B-once ablation flat 1.006x). T=1 mma is 4-7% faster than the CUDA-core GEMV on W4 shapes (matches E1 GB/s within 2%). All GEMVs sit at the SW power cap; cheaper dequant +0.4-1.2% GB/s only. Modelled end-to-end (measured GEMV + modelled state/KV/F + E0 acceptance): T=4 verify +5.8% step; int4 MTP layer + 32k draft head => k=3 150/98/146/119 tok/s (code/prose/math/8K) = 1.56-1.58x stock vLLM (1.11-1.16x with vLLM's 3.9 ms draft), plain 1.05x. Draft cost, not verify, is the lever; restricted-head acceptance unmeasured. See [experiments/2026-10-30-w4-multirow-verify-and-power/README.md](../experiments/2026-10-30-w4-multirow-verify-and-power/README.md).\n- 2026-10-31 \u2014 E3 w4-multirow-verify-and-power done (medium): mma W4A16 verify time vs T=1 at T=4/8/16 = 1.02-1.05 / 1.12-1.15 / 1.45 (limit is L1 traffic from per-warp activation re-fetch, not tensor pipe or dequant; staging the activation tile once is flat); mma T=1 is 4-7% faster than CUDA-core GEMV on W4 shapes (keep CUDA-core for BF16 lm_head); every kernel is at the 350 W cap, cheaper dequant gains <=1.2% GB/s. Model: T=4 verify adds 5.8% to a plain step; with an int4 MTP layer + 32k draft head (0.75 ms/draft) k=3 reaches ~150/98/146/119 tok/s (code/prose/math/8K) = 1.56x stock vLLM; with vLLM-style draft (3.9 ms) only 1.11-1.16x. Draft cost is the lever; acceptance under the cheap draft is unmeasured (E4 running). E2 abandoned (cancelled), open.\n- 2026-10-31 \u2014 E4 mtp-draft-head-ablation done (medium; 25 prompts, k=3): draft-path approximations", "raw": "Fastest single-3090 decode of Swift-1.5-Qwen3.8-27b-INT4 (W4A16 g128 + MTP): does a fused/persistent megakernel beat vLLM's CUDA-graph decode, and how much of the gain is persistence vs fusion/GEMV quality?"}], "commits": [{"hash": "9b007df", "date": "2026-10-31 07:18", "msg": "experiment: E0 vLLM Swift INT4 bs1 baseline done"}, {"hash": "7b32133", "date": "2026-10-31 13:59", "msg": "exp: w4-multirow-verify-and-power \u2014 mma W4 verify x1.02/1.12/1.45 at T=4/8/16 (L1 B-traffic, not tensor pipe); modelled k=3 1.56x vs stock vLLM"}, {"hash": "4af8d38", "date": "2026-10-31 14:00", "msg": "experiment: mark E2 abandoned; record E3 in idea"}, {"hash": "a2de66b", "date": "2026-10-31 14:02", "msg": "exp: mtp-draft-head-ablation \u2014 pre-register prediction"}, {"hash": "0d719ee", "date": "2026-10-31 14:17", "msg": "swift-mk/oracle: CPU reference (dequant, HF-checked decoder, MTP head), dumps, sanity+HF checks"}, {"hash": "3e2fca6", "date": "2026-10-31 14:26", "msg": "swift-mk: K1 fused DeltaNet decode kernel (T=1..4, ring snapshots) + test vs oracle + bench"}, {"hash": "270fece", "date": "2026-10-31 17:02", "msg": "swift-mk: K3 engine core (W4 mma GEMV, norms, lm_head, 64-layer CUDA-graph step, packer, driver); token parity with oracle, 21.3 ms/step"}, {"hash": "29f0e28", "date": "2026-10-31 17:11", "msg": "swift-mk: K3 a|b on parallel graph branch, 20.9 ms/step (47.8 tok/s), profile + fused-norm negative result"}, {"hash": "f1e5201", "date": "2026-10-31 18:44", "msg": "exp: mtp-draft-head-ablation \u2014 int4 MTP layer + int4/int8 draft head free; 32k restricted vocab not (V=32k -6%, 48k+prompt+gen free); E3 combined 1.51x not 1.56x"}, {"hash": "426fbf1", "date": "2026-10-31 18:45", "msg": "swift-mk
