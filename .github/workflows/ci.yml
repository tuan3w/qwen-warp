name: ci
# No GPU and no checkpoint on GitHub runners: this only checks that warpc compiles and lints, uv.lock matches pyproject.toml, markdown links resolve and no
# personal paths or keys are committed.  The warpc tests that need a GPU, a checkpoint or the legacy checkout are run by hand.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  repo-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: scripts/check_repo.sh
